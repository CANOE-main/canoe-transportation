name: Documentation

# Manual only: prepare/review artifacts first. No deployment occurs unless the
# workflow is explicitly dispatched with deploy=true and Pages is configured.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the reviewed documentation to GitHub Pages
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the locked documentation environment
        run: uv sync --locked --group docs
      - name: Prepare pinned rendering dependencies explicitly
        run: |
          uv run --locked --group docs python scripts/build_docs.py prepare-assets
          uv run --locked --group docs playwright install --with-deps chromium
      - name: Build the explicit publication set
        run: uv run --locked --group docs python scripts/build_docs.py build
      - name: Render and check the complete offline PDF
        run: uv run --locked --group docs python scripts/build_docs.py pdf
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-review
          path: |
            outputs/documentation/site
            outputs/documentation/canoe_transportation_report.pdf
            outputs/validation/documentation
      - uses: actions/upload-pages-artifact@v3
        if: inputs.deploy
        with:
          path: outputs/documentation/site
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
