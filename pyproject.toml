[project]
name = "canoe-transportation"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rashidzetter", email = "rashidzetter@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "snakemake>=9.19.0",
    "sqlalchemy>=2.0.49",
]

[project.scripts]
canoe-transportation = "canoe_transportation:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
