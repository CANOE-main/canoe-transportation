[project]
name = "canoe-transportation"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rashidzetter", email = "rashidzetter@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "canoe-schema",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pydantic>=2.13,<3",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "xlrd>=2.0.2",
    "xlwings>=0.37.5 ; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["fetching", "parameterization", "utils", "validation"]

[tool.uv.sources]
canoe-schema = { git = "https://github.com/CANOE-main/canoe-schema.git", branch = "main" }

[dependency-groups]
dev = [
    "altair>=6.2.2",
    "ast-grep-cli>=0.45.3",
    "ipykernel>=7.2.0",
    "marimo>=0.23.15",
    "pyarrow>=25.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "scipy>=1.18.1",
]
docs = [
    "beautifulsoup4>=4.13,<5",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocs-print-site-plugin>=2.7,<3",
    "playwright>=1.50,<2",
    "pymupdf>=1.25,<2",
    "vl-convert-python>=1.8,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
exclude = [
    "legacy_backend",
    "outputs",
]
