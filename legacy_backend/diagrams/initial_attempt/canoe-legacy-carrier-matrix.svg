  <title id="legacy-matrix-title">Legacy fuel-to-mode compatibility</title>
  <desc id="legacy-matrix-description">A filled dot means at least one legacy vehicle technology has an Efficiency path from that carrier. PHEV mixtures resolve to both their liquid fuel and electricity. Counts include existing and new variants.</desc>
  <defs>
    <marker id="arrow-technology" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#416184" />
    </marker>
    <marker id="arrow-fuel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
