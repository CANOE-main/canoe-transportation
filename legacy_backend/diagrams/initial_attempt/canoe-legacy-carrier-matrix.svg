    <text id="label-017" x="1689" y="177" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">Hydrogen</text>
    <text id="label-018" x="60" y="279" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Motorcycles</text>
    <text id="label-019" x="590" y="279" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">3</text>
    <text id="label-020" x="60" y="331" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Cars</text>
    <text id="label-021" x="590" y="331" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">16</text>
    <text id="label-022" x="60" y="383" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Passenger light trucks</text>
    <text id="label-023" x="590" y="383" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">16</text>
    <text id="label-024" x="60" y="435" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Freight light trucks</text>
    <text id="label-025" x="590" y="435" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">15</text>
