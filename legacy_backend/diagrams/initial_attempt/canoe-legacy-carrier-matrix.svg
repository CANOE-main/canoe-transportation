  <g id="labels">
    <text id="label-001" x="40" y="50" font-family="Arial" font-size="38" font-weight="600" text-anchor="start" fill="#253449">Legacy fuel-to-mode compatibility</text>
    <text id="label-002" x="40" y="92" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#536174">Eligibility derived from the compiled legacy SQLite, including blends and charging</text>
    <text id="label-003" x="40" y="196" font-family="Arial" font-size="28" font-weight="600" text-anchor="start" fill="#253449">Technology family</text>
    <text id="label-004" x="590" y="177" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">Tech.</text>
    <text id="label-005" x="590" y="211" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">count</text>
    <text id="label-006" x="730" y="177" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">Gasoline</text>
    <text id="label-007" x="730" y="211" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">blend</text>
    <text id="label-008" x="867" y="177" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">Diesel</text>
    <text id="label-009" x="867" y="211" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">blend</text>
    <text id="label-010" x="1004" y="177" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">CNG</text>
    <text id="label-011" x="1141" y="177" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">LNG</text>
    <text id="label-012" x="1278" y="177" font-family="Arial" font-size="26" font-weight="600" text-anchor="middle" fill="#253449">Jet</text>
