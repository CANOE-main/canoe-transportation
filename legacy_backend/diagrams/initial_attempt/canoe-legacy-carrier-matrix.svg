    <text id="label-027" x="590" y="487" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">9</text>
    <text id="label-028" x="60" y="539" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Heavy trucks</text>
    <text id="label-029" x="590" y="539" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">7</text>
    <text id="label-030" x="60" y="591" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">School buses</text>
    <text id="label-031" x="590" y="591" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">11</text>
    <text id="label-032" x="60" y="643" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Transit buses</text>
    <text id="label-033" x="590" y="643" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">12</text>
    <text id="label-034" x="60" y="695" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Intercity buses</text>
    <text id="label-035" x="590" y="695" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">7</text>
    <text id="label-036" x="60" y="747" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Jet aircraft</text>
    <text id="label-037" x="590" y="747" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">6</text>
    <text id="label-038" x="60" y="799" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Rail</text>
    <text id="label-039" x="590" y="799" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">7</text>
    <text id="label-040" x="60" y="851" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Marine vessels</text>
    <text id="label-041" x="590" y="851" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">5</text>
    <text id="label-042" x="60" y="903" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">Off-road</text>
    <text id="label-043" x="590" y="903" font-family="Arial" font-size="28" font-weight="400" text-anchor="middle" fill="#253449">1</text>
    <text id="label-044" x="80" y="983" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#253449">At least one technology uses this carrier; an empty cell has no such represented path.</text>
    <text id="label-045" x="40" y="1027" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" fill="#536174">PHEVs mark both liquid fuel and electricity. Hydrogen is classified at vehicle input, irrespective of production route.</text>
    <text id="label-046" x="40" y="1069" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" fill="#536174">Counts include existing/new and range variants; charging, blending and supply technologies are counted separately.</text>
    <text id="label-047" x="40" y="1104" font-family="Arial" font-size="26" font-weight="400" text-anchor="start" fill="#536174">Off-road is represented as diesel energy demand (PJ), rather than passenger-km or tonne-km.</text>
  </g>
