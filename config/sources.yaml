    validation_rule: Preserve the registered PDF identity and all Table C-1 heavy-duty annual survival values for ages 0-40, with native class, table and page evidence.
    refresh_notes: >
      Table C-1 is printed page 190, PDF page 192. Appendix C describes these as
      conditional year-to-year survival rates, not cumulative survival. The
      heavy-duty schedule is TEDB40 Table 3.16 model-year-1980 evidence, extended
      beyond age 30 to 40 and shared by buses, single-unit and combination trucks.
      MOVES5 retains it for age-distribution development rather than runtime
      scrappage. The backend applies it only to heavy trucks as an explicit
      US-source proxy; other road classes keep their configured NHTSA schedules.
      Temporal DQ reflects the underlying MY1980 cohort, not the report year.
      NEPIS requires the configured browser User-Agent to return the PDF; its
      default Python-client response is a short redirect/error document. Review
      bytes, page layout and underlying evidence before changing the registration.
    adapter:
