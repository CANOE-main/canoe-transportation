  ontario_ministry_transport_vehicle_population:
    title: "Ontario Ministry of Transportation vehicle population data"
    status: active
    source_type: upstream_download
    file_type: zip
    version: "Annual CKAN resources; latest edition discovered at run time"
    required: true
    adapter:
      access:
        method: ckan_package
        ckan_base_url: "https://data.ontario.ca"
        package_id: vehicle-population-data
        resource_selector:
          format: zip
          year_fields: [name, url]
          year_pattern: '(?<!\d)(20\d{2})(?!\d)'
      cache_path_template: "ontario_vehicle_population/{year}_vehicle_population_data.zip"
      years:
        default: latest
        historical: all
    components:
      A:
        label: "Report A: vehicle class, make code, model code, model year, and registration status"
        short_name: on_vehicle_make_model_vintage_status
        inputs: [vehicle_class, vehicle_make_code, vehicle_model_code, vehicle_model_year, registration_status_counts]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [fleet_age_disaggregation, vehicle_class_aggregation_weights, apparent_cohort_retention]
        parameter_modules: [road_aggregation, lifetimes_survival]
        adapter:
          raw_member_templates:
            - "{year}_Reg_Veh_ReportA_Class&Make&Model&Year.TXT"
            - "{year}_Reg_Veh_Report6_Class&Status&Make&Model&Year.txt"
          archive_depth: 1
      4:
        label: "Report 4: vehicle weight class by registration status"
        short_name: on_commercial_vehicle_weight_classes
        inputs: [fit_active_stock, vehicle_gross_weight_buckets, vehicle_class]
        applies_to: [medium_trucks, heavy_trucks]
        produces: [epa_weight_class_disaggregation]
        parameter_modules: [road_aggregation]
        adapter:
          raw_member_template: "{year}_Reg_Veh_Report4_Weight_Class&Status.TXT"
      5:
        label: "Report 5: vehicle class by registration status and descriptor"
        short_name: vehicle_age_distribution_by_class
        inputs: [fit_active_stock, vehicle_model_year, vehicle_class]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks, motorcycles, transit_buses, school_buses, inter_city_buses]
        produces: [fleet_age_disaggregation]
        parameter_modules: []
        adapter:
          raw_member_template: "{year}_Reg_Veh_Report5_Class&Status&Descriptors.TXT"
        notes: "Retained for legacy comparison; Ontario LDV age distributions use Report A."
    units: "Vehicle counts by registration status; Report 4 weight bounds are kilograms."
    citation: "Ontario Ministry of Transportation. (2025). Vehicle population data—Ontario Data Catalogue [Dataset]. https://data.ontario.ca/dataset/vehicle-population-data"
    validation_rule: "CKAN metadata must expose one unambiguous annual ZIP per usable year; each ZIP must be integral and contain the configured Report A equivalent, while the latest ZIP must also contain Reports 4 and 5. Report A status columns must reconcile to TOTAL."
    refresh_notes: >
      Source ZIP URLs are CKAN resources and may change by release. Discover and
      sort annual resources from Ontario Data Catalogue package metadata instead
      of hardcoding a year or resource URL. The 2014 Report 6 member is a
      schema-compatible predecessor of Report A; the 2015 edition is excluded
      because it contains only suppressed make/model keys. The 2017 and 2019
      resources contain a nested VPS.zip. Report 4 remains authoritative for
      commercial GVWR processing. Report 5 is retained only for legacy
      comparison; Report A requires a separately reviewed make/model mapping.

  statcan_transport_tables:
    title: "Statistics Canada transportation tables"
    status: active
    source_type: upstream_download
    file_type: zip
    version: "registry-2026-07-21"
    required: true
    adapter:
      access:
        method: statcan_wds_full_table_csv
        language: en
        cube_metadata_url: "https://www150.statcan.gc.ca/t1/wds/rest/getCubeMetadata"
        full_table_url_template: "https://www150.statcan.gc.ca/t1/wds/rest/getFullTableDownloadCSV/{product_id}/{language}"
      cache_path_template: "statcan_transport/{product_id}-eng.zip"
      metadata_cache_path_template: "statcan_transport/{product_id}-metadata.json"
    units: varies by table and characteristic; preserve UOM and SCALAR_FACTOR
    citation: "Statistics Canada. Web Data Service and cited tables. https://www.statcan.gc.ca/en/developers/wds"
    validation_rule: "WDS metadata must match configured table titles/dimensions/members, and each resolved English full-table ZIP must contain its PID data CSV."
    refresh_notes: >
      Resolve current archive URLs through getFullTableDownloadCSV rather than DOI or
      table-viewer pages. Cache both cube metadata and the authoritative full-table ZIP.
    components:
      "20-10-0021-01":
        label: "New motor vehicle registrations, inactive"
        short_name: archived_ldv_new_registrations
        inputs: [sales, fuel_type, vehicle_size_class]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
        version: "2011-2021"
        citation: "Statistics Canada. Table 20-10-0021-01. https://doi.org/10.25318/2010002101-eng"
        validation_rule: "Archived annual table must expose 2011-2021 geography, fuel type, LDV type, and number-of-vehicles series."
        adapter: {product_id: 20100021, frequency: annual, archive_status: archived}
      "20-10-0025-01":
        label: "New motor vehicle registrations, quarterly, by geographic level"
        short_name: current_ldv_new_registrations
        inputs: [sales, fuel_type, vehicle_size_class]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
        version: "2017-present"
        citation: "Statistics Canada. Table 20-10-0025-01. https://doi.org/10.25318/2010002501-eng"
        validation_rule: "Current quarterly table must expose exact province-level geography, fuel type, LDV type, and number-of-vehicles series."
        adapter: {product_id: 20100025, frequency: quarterly, archive_status: current}
      "23-10-0308-01":
        label: "Vehicle registrations, by type of vehicle and fuel type"
        short_name: vehicle_registrations_by_size_and_fuel_type
        inputs: [stock, fuel_type, vehicle_size_class]
        applies_to: [medium_trucks]
        produces: [fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
        version: "2017-present"
        citation: "Statistics Canada. Table 23-10-0308-01. https://doi.org/10.25318/2310030801-eng"
        validation_rule: "Annual table must expose the 4,536-11,793 kg vehicle class, configured fuel types, and number-of-vehicles series by province."
        adapter: {product_id: 23100308, frequency: annual, archive_status: current}
      "34-10-0254-01":
        label: "Average expected useful life of new publicly owned public transit assets, Infrastructure Canada"
        short_name: buses_lifetimes
        inputs: [average_useful_life]
        applies_to: [transit_buses, school_buses, inter_city_buses]
        produces: [lifetime]
        parameter_modules: [lifetimes_survival]
        version: "2016-2020"
        citation: "Statistics Canada. Table 34-10-0254-01. https://doi.org/10.25318/3410025401-eng"
        validation_rule: "Occasional table must expose the six configured bus asset useful-life members in average years by province."
        adapter: {product_id: 34100254, frequency: occasional, archive_status: current}
        notes: >
          Get the average years of useful life from diesel buses, electric buses, natural gas buses, and hybrid buses; assume that gasoline buses have diesel-like lifetimes.
      "23-10-0142-01":
        label: "Origin and destination of transported commodities, Canadian Freight Analysis Framework"
        short_name: freight_shipments_weight_distance
        inputs: [activity, shipment_weight, shipment_distance]
        applies_to: [heavy_trucks]
        produces: [heavy_freight_haul_disaggregation]
        parameter_modules: [road_aggregation]
        version: "2011-2017"
        citation: "Statistics Canada. Table 23-10-0142-01. https://doi.org/10.25318/2310014201-eng"
        validation_rule: "Annual table must expose origin, destination, Truck (for-hire), every commodity group, and shipments/weight/distance/tonne-kilometre characteristics."
        adapter: {product_id: 23100142, frequency: annual, archive_status: current}

  cer_canadas_energy_future:
    title: "CER Canada's Energy Future"
    status: active
    source_type: upstream_download
    file_type: csv
    version: "2023 and 2026 editions"
    required: true
    adapter:
      access:
        method: direct_csv_by_edition
        url_template: "https://www.cer-rec.gc.ca/open/energy/energyfutures{edition}/{resource}-{edition}.csv"
      cache_path_template: "cer_energy_future/{edition}/{resource}-{edition}.csv"
      editions:
        default: 2026
        allowed:
          2023:
            doi: "https://doi.org/10.35002/zppg-yr91"
            open_government_record_id: "7643c948-d661-4d90-ab91-e9ac732fc737"
            scenarios: [Canada Net-zero, Current Measures, Global Net-zero]
            year_range: [2005, 2050]
          2026:
            doi: "https://doi.org/10.35002/rd69-q158"
            open_government_record_id: "07c42deb-9435-43b9-a416-7ce316f3893d"
            scenarios: [Canada Net-zero, Current Measures, Higher Scenario, Lower Scenario]
            year_range: [2005, 2050]
    units: "Macro units are variable-labelled; demand is PJ; prices are 2022 CAD/GJ."
    citation: "Canada Energy Regulator. Canada's Energy Future data. https://www.cer-rec.gc.ca/en/data-analysis/canada-energy-future/"
    validation_rule: "For the requested edition, all three official English CSVs must expose configured columns, scenarios, and 2005-2050 coverage."
    refresh_notes: >
      Select the report edition explicitly. Cache direct CER-hosted Open Government CSVs;
      do not scrape the report or visualization. GDP and deflator reference years differ
      by edition and must remain source-labelled until configured currency harmonization.
    components:
      macro-indicators:
        label: "Macroeconomic indicators"
        short_name: macro_indicators_for_demand_and_currency_conversion
        inputs: [real_gdp, gdp_deflator, cad_per_usd_exchange_rate]
        applies_to: [all_classes]
        produces: [demand_growth_index, currency_harmonization]
        parameter_modules: [stocks_and_demands, capex_opex]
        units: "Variable-labelled: real GDP in constant CAD millions, GDP deflator index, and C$/US$."
        validation_rule: "Must contain Canada-level real GDP, GDP deflator, and Canada-US exchange-rate series for every edition scenario."
        adapter: {resource: macro-indicators}
      end-use-demand:
        label: "End-use energy demand"
        short_name: transport_fuel_demand_benchmark
        inputs: [fuel_use]
        applies_to: [all_classes]
        produces: [transport_fuel_demand_benchmark]
        parameter_modules: []
        units: PJ
        notes: "Fetched for output benchmarking only; it is not currently a CANOE scenario input."
        validation_rule: "Must contain Transportation demand by fuel, region, year, and scenario in PJ."
        adapter: {resource: end-use-demand}
      end-use-prices:
        label: "End-use energy prices"
        short_name: transport_gasoline_diesel_prices
        inputs: [gasoline_price, diesel_price]
        applies_to: [all_classes]
        produces: [fuel_price_scenarios]
        parameter_modules: [sector_coupling]
        units: "2022 CAD/GJ"
        notes: "Retained provisionally because fuel prices currently belong to the CANOE fuel-sector backend."
        validation_rule: "Must contain Transportation gasoline and diesel prices by region, year, and scenario in 2022 CAD/GJ."
        adapter: {resource: end-use-prices}

  nlr_atb_transportation_2024:
    title: "2024 Transportation Annual Technology Baseline"
    status: active
    source_type: upstream_download
    file_type: zip
    version: "2024 v1"
    required: true
    adapter:
      access:
        method: direct_zip
        url: "https://atb.nlr.gov/img/other/2024_atb_transportation_data_v1.zip"
      cache_path: "nlr_atb_autonomie/2024/2024_atb_transportation_data_v1.zip"
      expected_trajectories: [Advanced, Conservative, Constant, Mid]
    units: "Metric-labelled 2022 USD, miles, mi/dge, mi/gge, kWh, and source-labelled maintenance/VMT units."
    citation: "National Renewable Energy Laboratory. 2024 Transportation Annual Technology Baseline Data. https://atb.nlr.gov/transportation/2024/data"
    validation_rule: "The official ZIP must contain one unambiguous member for every required configured component, with expected source columns, all four trajectories, and non-empty data."
    refresh_notes: >
      Cache the official release ZIP without unpacking it into the cache. Discover
      configured members case-insensitively so a harmless release-directory prefix does
      not break the adapter, but fail on missing or ambiguous matches.
    components:
      vehicles:
        label: "Transportation ATB vehicle projections"
        short_name: atb_vehicle_cost_performance_trajectories
        inputs: [scenario, vehicle_class, size_weight_class, powertrain, fuel_economy, modeled_price, all_electric_range, usable_battery_capacity]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks, transit_buses, school_buses, inter_city_buses]
        produces: [vehicle_efficiency, vehicle_cost, all_electric_range, usable_battery_capacity]
        parameter_modules: [efficiencies, capex_opex]
        units: "Metric-labelled: mi/dge, mi/gge, 2022 USD, miles, and kWh."
        validation_rule: "Must retain Advanced, Conservative, Constant, and Mid trajectories and expose configured vehicle dimensions, metric, value, and reference columns. PHEV fuel economy is reconciliation evidence only; other PHEV metrics and all configured non-PHEV metrics remain authoritative."
        adapter:
          member_patterns: ["output/vehicles.csv", "*/output/vehicles.csv"]
          format: csv
          normalizer: vehicles
          required_columns: [year, scenario, vehicle_weight_category, vehicle_class, vehicle_powertrain, vehicle_detail, fuel_category, fuel2_category, metric, value, reference]
      phev_vehicle_inputs:
        label: "Transportation ATB source PHEV vehicle inputs"
        short_name: atb_phev_vehicle_efficiency_inputs
        inputs: [scenario, vehicle_class, size_weight_class, powertrain, combined_cs_fuel_economy_mi_per_gge, combined_cd_electricity_consumption_wh_per_mi, cycle_contributions, cycle_fuel_economy, cycle_electricity_consumption, all_electric_range]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks, transit_buses, school_buses, inter_city_buses]
        produces: [utility_weighted_energy_consumption, phev_energy_input_shares]
        parameter_modules: [efficiencies]
        units: "mi/gge, mi/dge, Wh/mi, miles, and dimensionless cycle contributions."
        validation_rule: "Must expose one PHEV source-input row per configured vehicle dimension, year, and trajectory. LDV combined fields and MHDV cycle fields are validated before any utility weighting."
        adapter:
          member_patterns: ["input/inputs_vehicles.csv", "*/input/inputs_vehicles.csv"]
          format: csv
          normalizer: phev_vehicle_inputs
          required_columns: [year, scenario, fuel_category, fuel2_category, vehicle_weight_category, vehicle_class, vehicle_powertrain, vehicle_detail, "CS(mi/gge)", "CD(Wh/mi)", ARB_contribution, EPA55_contribution, EPA65_contribution, "ARB_CS(mpgde)", "EPA55_CS(mpgde)", "EPA65_CS(mpgde)", "ARB_CD(Wh/mi)", "EPA55_CD(Wh/mi)", "EPA65_CD(Wh/mi)", "range(mi)", reference]
      phev_utility_factor_ldv:
        label: "Transportation ATB light-duty fleet PHEV utility factors"
        short_name: atb_phev_fleet_utility_factors_ldv
        inputs: [size_weight_class, all_electric_range, fleet_utility_factor]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [utility_weighted_energy_consumption]
