    components:
      A:
        database_note: "Fit-active Ontario make/model cohorts classified through reviewed mappings; suppressed and unresolved keys limit represented fleet coverage."
        label: "Report A: vehicle class, make code, model code, model year, and registration status"
        short_name: on_vehicle_make_model_vintage_status
        inputs: [vehicle_class, vehicle_make_code, vehicle_model_code, vehicle_model_year, registration_status_counts]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [fleet_age_disaggregation, vehicle_class_aggregation_weights, apparent_cohort_retention]
        parameter_modules: [road_aggregation, road_lifetimes_survival, road_efficiencies, road_capex_opex, road_utilization]
        adapter:
          raw_member_templates:
            - "{year}_Reg_Veh_ReportA_Class&Make&Model&Year.TXT"
            - "{year}_Reg_Veh_Report6_Class&Status&Make&Model&Year.txt"
          archive_depth: 1
      4:
        database_note: "Fit-active Ontario commercial registrations by gross-weight band; weight-class shares are not vehicle sales or vocation shares."
        data_quality: {dq_struc: 3, dq_tech: 3}
        label: "Report 4: vehicle weight class by registration status"
        short_name: on_commercial_vehicle_weight_classes
        inputs: [fit_active_stock, vehicle_gross_weight_buckets, vehicle_class]
        applies_to: [medium_trucks, heavy_trucks]
        produces: [epa_weight_class_disaggregation]
        parameter_modules: [road_aggregation, road_efficiencies, road_capex_opex, road_utilization]
        adapter:
          raw_member_template: "{year}_Reg_Veh_Report4_Weight_Class&Status.TXT"
      5:
        database_note: "Fit-active Ontario ages for pooled commercial, motorcycle and bus registrations; broad registration classes proxy the corresponding model classes."
        data_quality: {dq_struc: 3, dq_tech: 3}
        label: "Report 5: vehicle class by registration status and descriptor"
        short_name: vehicle_age_distribution_by_class
        inputs: [fit_active_stock, vehicle_model_year, vehicle_class]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks, motorcycles, transit_buses, school_buses, inter_city_buses]
        produces: [fleet_age_disaggregation]
        parameter_modules: [road_stocks_and_demands]
        adapter:
          raw_member_template: "{year}_Reg_Veh_Report5_Class&Status&Descriptors.TXT"
        notes: "Production uses Report 5 age distributions for trucks, motorcycles, and buses; LDV age distributions use Report A."

  statcan_transport_tables:
    source_id: T04
    title: "Statistics Canada transportation tables"
    status: active
    source_type: upstream_download
    file_type: zip
    version: "registry-2026-07-21"
    units: varies by table and characteristic; preserve UOM and SCALAR_FACTOR
    citation: "Statistics Canada. Web Data Service and cited tables. https://www.statcan.gc.ca/en/developers/wds"
    database_note: "Canadian vehicle registrations, freight flows and reported transit-asset useful lives; coverage and statistical concepts differ by table."
    # dq_time: Time applicability differs by table; component scores below use actual observation years.
    data_quality: {dq_cred: 1, dq_geog: null, dq_struc: null, dq_tech: null, dq_time: 2}
    validation_rule: "WDS metadata must match configured table titles/dimensions/members, and each resolved English full-table ZIP must contain its PID data CSV."
    refresh_notes: >
      Resolve current archive URLs through getFullTableDownloadCSV rather than DOI or
      table-viewer pages. Cache both cube metadata and the authoritative full-table ZIP.
    adapter:
      access:
        method: statcan_wds_full_table_csv
        language: en
        cube_metadata_url: "https://www150.statcan.gc.ca/t1/wds/rest/getCubeMetadata"
        full_table_url_template: "https://www150.statcan.gc.ca/t1/wds/rest/getFullTableDownloadCSV/{product_id}/{language}"
      cache_path_template: "statcan_transport/{product_id}-eng.zip"
      metadata_cache_path_template: "statcan_transport/{product_id}-metadata.json"
    components:
      "20-10-0021-01":
        database_note: "Archived annual new-LDV registrations by province, vehicle type and fuel; supplies history before current-table coverage, not the age distribution of surviving stock."
        # dq_time: 2011-2021 archived observations supply matching years before current-table coverage.
        data_quality: {dq_geog: 2, dq_struc: 2, dq_tech: 2, dq_time: 1}
        label: "New motor vehicle registrations, inactive"
        short_name: archived_ldv_new_registrations
        inputs: [sales, fuel_type, vehicle_size_class]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [fuel_type_disaggregation]
        parameter_modules: [road_stocks_and_demands]
        version: "2011-2021"
        citation: "Statistics Canada. Table 20-10-0021-01. https://doi.org/10.25318/2010002101-eng"
        validation_rule: "Archived annual table must expose 2011-2021 geography, fuel type, LDV type, and number-of-vehicles series."
        adapter: {product_id: 20100021, frequency: annual, archive_status: archived}
      "20-10-0025-01":
        database_note: "Quarterly new-LDV registrations by geographic level, vehicle type and fuel; complete years are aggregated for historical fuel shares."
        # dq_time: Quarterly observations from 2017 onward aggregate to matching years.
        data_quality: {dq_geog: 2, dq_struc: 2, dq_tech: 2, dq_time: 1}
        label: "New motor vehicle registrations, quarterly, by geographic level"
        short_name: current_ldv_new_registrations
        inputs: [sales, fuel_type, vehicle_size_class]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [fuel_type_disaggregation]
        parameter_modules: [road_stocks_and_demands]
        version: "2017-present"
        citation: "Statistics Canada. Table 20-10-0025-01. https://doi.org/10.25318/2010002501-eng"
        validation_rule: "Current quarterly table must expose exact province-level geography, fuel type, LDV type, and number-of-vehicles series."
        adapter: {product_id: 20100025, frequency: quarterly, archive_status: current}
      "23-10-0308-01":
        database_note: "Registered vehicle stock by province, weight class and fuel; stock composition is used as a fuel-mix proxy rather than new-vehicle sales."
        data_quality: {dq_geog: 2, dq_struc: 3, dq_tech: 2}
        label: "Vehicle registrations, by type of vehicle and fuel type"
        short_name: vehicle_registrations_by_size_and_fuel_type
        inputs: [stock, fuel_type, vehicle_size_class]
        applies_to: [medium_trucks]
        produces: [fuel_type_disaggregation]
        parameter_modules: [road_stocks_and_demands]
        version: "2017-present"
        citation: "Statistics Canada. Table 23-10-0308-01. https://doi.org/10.25318/2310030801-eng"
        validation_rule: "Annual table must expose configured medium and heavy vehicle classes, fuel types, and number-of-vehicles series by province."
        adapter: {product_id: 23100308, frequency: annual, archive_status: current}
      "34-10-0254-01":
        database_note_variants:
          canada_fallback: "Canada-level reported useful life substitutes where the selected province has no usable value."
        database_note: "Reported expected useful lives of new publicly owned transit assets; broad bus and powertrain categories proxy technologies beyond the surveyed assets."
        # dq_time: Latest provincial 2016-2020 useful lives and Canada 2020 fallback persist across vintages.
        data_quality: {dq_cred: 2, dq_geog: 2, dq_struc: 3, dq_tech: 3, dq_time: 3}
        label: "Average expected useful life of new publicly owned public transit assets, Infrastructure Canada"
        short_name: buses_lifetimes
        inputs: [average_useful_life]
        applies_to: [transit_buses, school_buses, inter_city_buses]
        produces: [lifetime]
        parameter_modules: [road_lifetimes_survival]
        version: "2016-2020"
        citation: "Statistics Canada. Table 34-10-0254-01. https://doi.org/10.25318/3410025401-eng"
        validation_rule: "Occasional table must expose the six configured bus asset useful-life members in average years by province and for Canada in 2020."
        adapter: {product_id: 34100254, frequency: occasional, archive_status: current}
        notes: >
          Use each province's latest reported 2016-2020 useful life, falling back to Canada 2020 for missing powertrains and BCT. Gasoline buses inherit diesel useful life; emerging PHEV, FCEV, and FCHEV buses inherit electric useful life.
      "23-10-0142-01":
        database_note: "For-hire truck freight shipments and tonne-kilometres by origin and destination; haul shares proxy the broader heavy-truck fleet."
        # dq_time: 2011-2017 for-hire haul shares proxy later heavy-truck composition.
        data_quality: {dq_cred: 2, dq_geog: 2, dq_struc: 3, dq_tech: 3, dq_time: 3}
        label: "Origin and destination of transported commodities, Canadian Freight Analysis Framework"
        short_name: freight_shipments_weight_distance
        inputs: [activity, shipment_weight, shipment_distance]
        applies_to: [heavy_trucks]
        produces: [heavy_freight_haul_disaggregation]
        parameter_modules: [road_aggregation]
        version: "2011-2017"
        citation: "Statistics Canada. Table 23-10-0142-01. https://doi.org/10.25318/2310014201-eng"
        validation_rule: "Annual table must expose origin, destination, Truck (for-hire), every commodity group, and shipments/weight/distance/tonne-kilometre characteristics."
        adapter: {product_id: 23100142, frequency: annual, archive_status: current}

  cer_canadas_energy_future:
    source_id: T05
    title: "CER Canada's Energy Future"
    status: active
    source_type: upstream_download
    file_type: csv
    version: "2023 and 2026 editions"
    units: "Macro units are variable-labelled; demand is PJ; prices are 2022 CAD/GJ."
    citation: "Canada Energy Regulator. Canada's Energy Future data. https://www.cer-rec.gc.ca/en/data-analysis/canada-energy-future/"
    database_note: "Canadian energy and macroeconomic projections conditional on the selected report edition and policy scenario."
    # dq_time: Year-labelled historical/projection values cover 2005-2050; edition is not data year.
    data_quality: {dq_cred: 2, dq_geog: 2, dq_struc: 2, dq_tech: 2, dq_time: 1}
    validation_rule: "For the requested edition, all three official English CSVs must expose configured columns, scenarios, and 2005-2050 coverage."
    refresh_notes: >
      Select the report edition explicitly. Cache direct CER-hosted Open Government CSVs;
      do not scrape the report or visualization. GDP and deflator reference years differ
      by edition and must remain source-labelled until configured currency harmonization.
    adapter:
      access:
        method: direct_csv_by_edition
        url_template: "https://www.cer-rec.gc.ca/open/energy/energyfutures{edition}/{resource}-{edition}.csv"
      cache_path_template: "cer_energy_future/{edition}/{resource}-{edition}.csv"
      editions:
        allowed:
          2023:
            doi: "https://doi.org/10.35002/zppg-yr91"
            open_government_record_id: "7643c948-d661-4d90-ab91-e9ac732fc737"
            scenarios: [Canada Net-zero, Current Measures, Global Net-zero]
            year_range: [2005, 2050]
          2026:
            doi: "https://doi.org/10.35002/rd69-q158"
            open_government_record_id: "07c42deb-9435-43b9-a416-7ce316f3893d"
            scenarios: [Canada Net-zero, Current Measures, Higher Scenario, Lower Scenario]
            year_range: [2005, 2050]
    components:
      macro-indicators:
        database_note: "Canada-level real GDP, deflator and exchange-rate series; macroeconomic paths provide provincial transport-demand growth proxies and currency-conversion inputs."
        data_quality: {dq_struc: 3, dq_tech: 3}
        label: "Macroeconomic indicators"
        short_name: macro_indicators_for_demand_and_currency_conversion
        inputs: [real_gdp, gdp_deflator, cad_per_usd_exchange_rate]
        applies_to: [all_classes]
        produces: [demand_growth_index, currency_harmonization]
        parameter_modules:
          - road_stocks_and_demands
          - offroad_stocks_and_demands
          - road_capex_opex
          - offroad_capex_opex
        units: "Variable-labelled: real GDP in constant CAD millions, GDP deflator index, and C$/US$."
        validation_rule: "Must contain Canada-level real GDP, GDP deflator, and Canada-US exchange-rate series for every edition scenario."
        adapter: {resource: macro-indicators}
      end-use-demand:
        database_note: "Transport energy demand by region, fuel and scenario, retained for benchmarking."
        label: "End-use energy demand"
        short_name: transport_fuel_demand_benchmark
        inputs: [fuel_use]
        applies_to: [all_classes]
        produces: [transport_fuel_demand_benchmark]
        units: PJ
        notes: "Fetched for output benchmarking only; it is not currently a CANOE scenario input."
        validation_rule: "Must contain Transportation demand by fuel, region, year, and scenario in PJ."
        adapter: {resource: end-use-demand}
      end-use-prices:
        database_note: "Transport gasoline and diesel prices in 2022 CAD/GJ; provisional evidence for the separately owned fuel sector."
        label: "End-use energy prices"
        short_name: transport_gasoline_diesel_prices
        inputs: [gasoline_price, diesel_price]
        applies_to: [all_classes]
        produces: [fuel_price_scenarios]
        units: "2022 CAD/GJ"
        notes: "Retained provisionally because fuel prices currently belong to the CANOE fuel-sector backend."
        validation_rule: "Must contain Transportation gasoline and diesel prices by region, year, and scenario in 2022 CAD/GJ."
        adapter: {resource: end-use-prices}

  nlr_atb_transportation:
    source_id: T06
    title: "2024 Transportation Annual Technology Baseline"
    status: active
    source_type: upstream_download
    file_type: zip
    version: "2024 v1"
    units: "Metric-labelled 2022 USD, miles, mi/dge, mi/gge, kWh, and source-labelled maintenance/VMT units."
    citation: "National Renewable Energy Laboratory. 2024 Transportation Annual Technology Baseline Data. https://atb.nlr.gov/transportation/2024/data"
    database_note: "U.S. road-vehicle technology trajectories and operating assumptions by class and powertrain; Canadian fleet weighting and service conversion are applied separately."
    database_precedence:
      - table: efficiency
        categories: [cars, passenger_light_trucks, freight_light_trucks]
        technology_suffixes: [_N]
        sub_categories: [bev, bev_150_miles, bev_200_miles, bev_300_miles, bev_400_miles, cng, diesel, fcev, gasoline, hev]
        components: [vehicles]
      - table: efficiency
        categories: [cars, passenger_light_trucks, freight_light_trucks]
        technology_suffixes: [_N]
        sub_categories: [phev, phev_35_miles, phev_50_miles]
        components: [phev_vehicle_inputs]
      - table: efficiency
        categories: [medium_trucks, heavy_trucks, school_buses, urban_transit]
        sub_categories: [bev, cng, diesel, fcev, fchev, gasoline, hev]
        components: [vehicles]
      - table: efficiency
        categories: [medium_trucks, heavy_trucks, school_buses, urban_transit]
        sub_categories: [phev]
        components: [phev_vehicle_inputs]
      - table: efficiency
        categories: [inter_city_buses]
        sub_categories: [hev]
        components: [vehicles]
      - table: cost_invest
        categories: [cars, passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks, school_buses, urban_transit]
      - table: cost_variable
        components: [maintenance_ldv]
    data_quality: {dq_cred: 2, dq_geog: 3, dq_struc: 2, dq_tech: 2, dq_time: 2}
    validation_rule: "The official ZIP must contain one unambiguous member for every required configured component, with expected source columns, all four trajectories, and non-empty data."
    refresh_notes: >
      Cache the official release ZIP without unpacking it into the cache. Discover
      configured members case-insensitively so a harmless release-directory prefix does
      not break the adapter, but fail on missing or ambiguous matches.
    adapter:
      access:
        method: direct_zip
        url: "https://atb.nlr.gov/img/other/2024_atb_transportation_data_v1.zip"
      cache_path: "nlr_atb_autonomie/2024/2024_atb_transportation_data_v1.zip"
      expected_trajectories: [Advanced, Conservative, Constant, Mid]
    components:
      vehicles:
        database_note: "U.S. vehicle technology and retail-equivalent price trajectories in 2022 USD; MHDV gasoline/CNG variants are absent, requiring mapped proxies. Manufacturing-cost conversion is applied separately."
        data_quality: {dq_time: 1}
        label: "Transportation ATB vehicle projections"
        short_name: atb_vehicle_cost_performance_trajectories
        inputs: [scenario, vehicle_class, size_weight_class, powertrain, fuel_economy, modeled_price, all_electric_range, usable_battery_capacity]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks, transit_buses, school_buses, inter_city_buses]
        produces: [vehicle_efficiency, vehicle_cost, all_electric_range, usable_battery_capacity]
        parameter_modules: [road_efficiencies, road_capex_opex]
        units: "Metric-labelled: mi/dge, mi/gge, 2022 USD, miles, and kWh."
        validation_rule: "Must retain Advanced, Conservative, Constant, and Mid trajectories and expose configured vehicle dimensions, metric, value, and reference columns. PHEV fuel economy is reconciliation evidence only; other PHEV metrics and all configured non-PHEV metrics remain authoritative."
        adapter:
          native_cost_currency: USD
          native_cost_dollar_year: 2022
          member_patterns: ["output/vehicles.csv", "*/output/vehicles.csv"]
          format: csv
          normalizer: vehicles
          required_columns: [year, scenario, vehicle_weight_category, vehicle_class, vehicle_powertrain, vehicle_detail, fuel_category, fuel2_category, metric, value, reference]
      phev_vehicle_inputs:
        database_note: "Autonomie PHEV charge-sustaining fuel use, charge-depleting electricity use and drive-cycle contributions; combined consumption requires the corresponding fleet utility factors."
        label: "Transportation ATB source PHEV vehicle inputs"
        short_name: atb_phev_vehicle_efficiency_inputs
        inputs: [scenario, vehicle_class, size_weight_class, powertrain, combined_cs_fuel_economy_mi_per_gge, combined_cd_electricity_consumption_wh_per_mi, cycle_contributions, cycle_fuel_economy, cycle_electricity_consumption, all_electric_range]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks, transit_buses, school_buses, inter_city_buses]
        produces: [utility_weighted_energy_consumption, phev_energy_input_shares]
        parameter_modules: [road_efficiencies]
        units: "mi/gge, mi/dge, Wh/mi, miles, and dimensionless cycle contributions."
        validation_rule: "Must expose one PHEV source-input row per configured vehicle dimension, year, and trajectory. LDV combined fields and MHDV cycle fields are validated before any utility weighting."
        adapter:
          member_patterns: ["input/inputs_vehicles.csv", "*/input/inputs_vehicles.csv"]
          format: csv
          normalizer: phev_vehicle_inputs
          required_columns: [year, scenario, fuel_category, fuel2_category, vehicle_weight_category, vehicle_class, vehicle_powertrain, vehicle_detail, "CS(mi/gge)", "CD(Wh/mi)", ARB_contribution, EPA55_contribution, EPA65_contribution, "ARB_CS(mpgde)", "EPA55_CS(mpgde)", "EPA65_CS(mpgde)", "ARB_CD(Wh/mi)", "EPA55_CD(Wh/mi)", "EPA65_CD(Wh/mi)", "range(mi)", reference]
      phev_utility_factor_ldv:
        database_note: "Light-duty fleet share of travel in charge-depleting operation by electric range, based on SAE J2841 utility factors supplied with Autonomie."
        label: "Transportation ATB light-duty fleet PHEV utility factors"
        short_name: atb_phev_fleet_utility_factors_ldv
        inputs: [size_weight_class, all_electric_range, fleet_utility_factor]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [utility_weighted_energy_consumption]
        parameter_modules: [road_efficiencies]
        units: "Miles and dimensionless fraction of distance in charge-depleting operation."
        validation_rule: "Weight-category/range keys must be unique, utility factors must lie in [0,1], and only configured bounded interpolation may fill a missing PHEV range."
        adapter:
          member_patterns: ["input/phev_uf_ldv.csv", "*/input/phev_uf_ldv.csv"]
          format: csv
          normalizer: phev_utility_factor_ldv
          required_columns: [vehicle_weight_category, "range(mi)", phev_uf, reference, notes]
      phev_utility_factor_mdhd:
        database_note: "MHDV share of travel in charge-depleting operation by vehicle class, based on Autonomie range and simulated usage."
        data_quality: {dq_struc: 3}
        label: "Transportation ATB medium- and heavy-duty fleet PHEV utility factors"
        short_name: atb_phev_fleet_utility_factors_mdhd
        inputs: [vehicle_class, weight_class, fleet_utility_factor]
        applies_to: [medium_trucks, heavy_trucks, transit_buses, school_buses, inter_city_buses]
        produces: [utility_weighted_energy_consumption]
        parameter_modules: [road_efficiencies]
        units: "Dimensionless fraction of distance in charge-depleting operation."
        validation_rule: "Weight-category/class keys must be unique, cover every MHDV PHEV exactly once, and utility factors must lie in [0,1]."
        adapter:
          member_patterns: ["input/phev_uf_mdhd.csv", "*/input/phev_uf_mdhd.csv"]
          format: csv
          normalizer: phev_utility_factor_mdhd
          required_columns: [vehicle_weight_category, vehicle_class, phev_uf, reference, notes]
      maintenance_ldv:
        database_note: "Burnham light-duty maintenance and repair assumptions by age, class and powertrain in 2020 USD; the repair relationship uses retail vehicle price."
        label: "Light-duty maintenance and repair assumptions"
        short_name: atb_ldv_maintenance_repair_assumptions
        inputs: [class_multiplier, powertrain_multiplier, baseline_repair_cost, maintenance_cost]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [vehicle_variable_costs]
        parameter_modules: [road_capex_opex]
        units: "Source-labelled dimensionless multipliers and USD per mile."
        validation_rule: "Workbook must expose all configured worksheets and expected columns."
        adapter:
          native_cost_currency: USD
          native_cost_dollar_year: 2020
          member_patterns: ["input/maintenance_ldv.xlsx", "*/input/maintenance_ldv.xlsx"]
          format: xlsx
          normalizer: maintenance_ldv
          sheets:
            class_multipliers:
              required_columns: [vehicle_weight_category, vehicle_class, class_multiplier, notes, reference, reference_url]
            powertrain_multipliers:
              required_columns: [vehicle_weight_category, vehicle_powertrain, powertrain_multiplier, notes, reference, reference_url]
            baseline_repair_cost:
              required_columns: [vehicle_weight_category, year_index, "baseline_repair_cost($/mi)", dollar_year, notes, reference, reference_url]
            maintenance_cost:
              required_columns: [vehicle_weight_category, vehicle_powertrain, "maintenance_cost($/mi)", dollar_year, notes, reference, reference_url]
      vmt_ldv:
        database_note: "U.S. age-based mileage profiles from SAFE FRIA 2020 odometer fits; the SUV profile extends beyond the original age coverage by extrapolation."
        data_quality: {dq_time: 3}
        label: "Light-duty age-based annual VMT schedules"
        short_name: atb_ldv_age_vmt
        inputs: [vehicle_age, annual_vmt]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [annual_mileage_profiles]
        parameter_modules: [road_utilization]
        units: "vehicle-miles traveled"
        validation_rule: "Must expose source vehicle classes, age index, annual VMT, references, and notes."
        adapter:
          member_patterns: ["input/vmt_ldv.csv", "*/input/vmt_ldv.csv"]
          format: csv
          normalizer: vmt_ldv
          required_columns: [vehicle_weight_category, vehicle_class, vehicle_class_NHTSA, year_index, "vmt(mi)", reference, notes]
        notes: "VMT values from SUV vehicle classes for years 26-31 are extrapolated from the 25-year value using a linear regression of the 0-24 year values."
      vmt_mdhd:
        database_note: "U.S. truck and bus age-based mileage profiles from Burnham, drawing on VIUS 2002; the underlying activity evidence is dated."
        data_quality: {dq_struc: 3, dq_time: 4}
        label: "Medium- and heavy-duty age-based annual VMT schedules"
        short_name: atb_mdhd_age_vmt
        inputs: [vehicle_age, annual_vmt]
        applies_to: [medium_trucks, heavy_trucks, transit_buses, school_buses, inter_city_buses]
        produces: [annual_mileage_profiles]
        parameter_modules: [road_utilization]
        units: "vehicle-miles traveled"
        validation_rule: "Must expose source vehicle classes, references, notes, and contiguous numeric age columns."
        adapter:
          member_patterns: ["input/vmt_mdhd.csv", "*/input/vmt_mdhd.csv"]
          format: csv
          normalizer: vmt_mdhd
          required_columns: [vehicle_weight_category, vehicle_class, notes, reference]
          age_column_pattern: "^[0-9]+$"

  anl_autonomie_bean:
    source_id: T07
    title: "ANL 2022 Autonomie and BEAN transportation analysis"
    status: active
    source_type: registered_external_model
    file_type: folder
    version: "ANL/ESD-22/6 (2022 release)"
    required: false
    units: "Source-labelled maintenance-and-repair linear-model coefficients."
