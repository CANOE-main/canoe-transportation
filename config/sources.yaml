# External-source registry.
#
# Each `sources` entry owns one external family's identity, release, access/cache
# contract, source-native units, citation, refresh notes, availability checks, and
# reviewed data-quality metadata. `components` describe the source-native datasets and
# their intended downstream roles. Source-specific discovery fields belong only under
# `adapter` and are validated by the adapter that consumes them.
#
# DQ is represented by the named v4 fields `dq_cred`, `dq_geog`, `dq_struc`, `dq_tech`,
# and `dq_time`. Each source explicitly owns its scores; null means awaiting review.
# Each null indicator resolves to the registry fallback of 5 for ordinary builds.
# Explicit component scores take precedence over explicit source scores; remaining
# indicators inherit the fallback. Placeholders remain visible here for later review.
# `database_note` is the SQLite data_source note, initially empty for manual annotation;
# `refresh_notes` and component `notes` document acquisition/evidence and are not copied
# into that database field.
# Every registered external source/component intended to support final parameter rows
# resolves the full applicable contract through component/source annotations and the
# registry fallback before insertion. DQ is source-owned, reviewable provenance evidence, not
# optional metadata. Automatic `dq_time` derivation from registered year/edition evidence
# is a deferred reviewed enhancement; the current contract defines no `auto` value,
# scoring algorithm, or thresholds.
#
# Extraction selectors, mappings, formulas, bins, and interim output names belong in
# `config/parameters/rules.yaml`; run-specific years/trajectories belong in scenario YAML.
# Regional fleet aggregation selections belong in each scenario's `aggregation_sources`.
# Backend-owned templates are not external sources and do not belong in this registry.
#
# Source order is provenance-significant: `source_id_mapping` assigns T01, T02, ... in
# YAML order. Append by default and explicitly review any insertion or reorder.

version: 3

defaults:
  required: true
  component_required: true
  data_quality: {dq_cred: 5, dq_geog: 5, dq_struc: 5, dq_tech: 5, dq_time: 5}

