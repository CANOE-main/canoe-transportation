  fueleconomy_gov_vehicle_data:
    source_id: T21
    title: "FuelEconomy.gov Find a Car vehicle data"
    status: active
    source_type: upstream_download
    file_type: zip
    version: "2026-09-29 vehicle snapshot"
    units: "Source vehicle classification records by model year, make, and model."
    citation: "U.S. Department of Energy and U.S. Environmental Protection Agency. FuelEconomy.gov Find a Car vehicle data. https://www.fueleconomy.gov/feg/ws/index.shtml"
    database_note: "U.S. model-year make/model and vehicle-class records used to corroborate Canadian vehicle classification; model names and classes require harmonization."
    # dq_time: Catalogue model years 1984-2027 support matching-year classification, not snapshot-year scoring.
    data_quality: {dq_cred: 1, dq_geog: 2, dq_struc: 2, dq_tech: 2, dq_time: 1}
    validation_rule: "Validate the pinned ZIP hash, byte count, vehicles.csv member, exact four selected columns, non-null values, and model-year bounds before VClass normalization."
    refresh_notes: >
      The public download is a moving file. Review its Last-Modified header, byte count,
      SHA-256, archive member, selected columns, model-year bounds, and complete VClass
      vocabulary together before replacing the pinned cache. Only year, make, model,
      and VClass are the classification contract. The separately registered range
      component authorizes additional fields from the same frozen cache; never refresh
      or widen classification implicitly.
    components:
      vehicles:
        label: "FuelEconomy.gov vehicles.csv (2026-09-29)"
        short_name: fueleconomy_vehicle_class_evidence
        inputs: [vehicle_model_year, vehicle_make, vehicle_model, vehicle_size_class]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [normalized_vehicle_class_evidence]
        parameter_modules: [road_aggregation]
        units: "Categorical vehicle records."
        validation_rule: "Select only year, make, model, and VClass and retain unresolved class normalizations explicitly."
        adapter:
          url: "https://www.fueleconomy.gov/feg/epadata/vehicles.csv.zip"
          cache_path: "fueleconomy_vehicles/2026-09-29_vehicles.csv.zip"
          archive_member: vehicles.csv
          expected_sha256: "33d32caa0343cdb11c47be631e8a80b7ed7c351ee8503646a4e96485bd67b22f"
          expected_bytes: 2212193
          expected_model_year_from: 1984
          expected_model_year_to: 2027
          required_columns: [year, make, model, VClass]
          required_non_null_columns: [year, make, model, VClass]

      range_evidence:
        database_note: "U.S. MY2024 BEV range and PHEV charge-depleting range keyed by model type; the range records carry no production weights."
        data_quality: {dq_time: 2}
        label: "FuelEconomy.gov MY2024 BEV/PHEV range and EPA model-type keys (2026-09-29)"
        short_name: fueleconomy_cd_range_evidence
        inputs: [vehicle_id, model_year, manufacturer_code, model_type_index, powertrain, range, secondary_fuel_range]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks]
        produces: [charge_depleting_range_evidence]
        units: "Miles; range for BEV, rangeA for PHEV with fuelType2=Electricity (CD mode, including blended operation)."
        validation_rule: "Validate the existing pinned vehicles ZIP; retain native ranges, fuel labels and phevBlended; reject nonpositive/unparseable range evidence rather than use PHEV total range."
        notes: "EPA model-type key join requires independent production accounting. Range rows alone never supply production weights."
        adapter:
          cache_component: vehicles
          required_columns: [year, make, model, VClass, id, mfrCode, engId, atvType, fuelType1, fuelType2, range, rangeA, phevBlended]
          required_non_null_columns: [year, make, model, VClass, id, engId]

