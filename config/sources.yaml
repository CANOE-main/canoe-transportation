# sources.yaml
#
# Purpose
# -------
# Registry of upstream datasets, externally produced model outputs, and legacy-derived
# source artifacts used by the CANOE transportation backend. This file should answer:
#   1. What source does a parameter module depend on?
#   2. Where should Snakemake look for it locally?
#   3. Can the workflow download/cache it automatically, or must the user provide it?
#   4. What basic validation should run before extraction/transformation?
#   5. How should the source be cited and refreshed?
#
# How this relates to the workflow
# -------------------------------
# In the first implementation, sources.yaml does not need to drive the whole backend.
# It can start as a documented registry that setup.py reads to create/check expected
# cache paths and that Snakemake uses to decide which source-availability checks must
# pass before parameter modules run.
#
# Suggested minimal behavior for v2.0:
#   - setup.py loads this file.
#   - For each source, setup.py creates/checks `path`.
#   - For `upstream_download` sources with a non-null `url`, setup.py downloads to cache.
#   - For `external_model_output` or `legacy_artifact` sources, setup.py validates presence
#     but does not attempt to generate them.
#   - Each parameter module records the source key(s) it consumed in its output metadata/logs.
#
# Per-source fields
# -----------------
# title:
#   Human-readable source name for logs, validation reports, and documentation.
#
# status:
#   Registration maturity. Suggested values:
#     active       = used by the current reproducible build.
#     pending      = known source family, but exact file/URL/table registration is unfinished.
#     legacy_only  = used only as evidence for reproducing/validating the legacy backend.
#     optional     = consumed only by some scenarios or optional modules.
#     deprecated   = retained for historical traceability but should not be used in new builds.
#
# source_type:
#   How the workflow should treat the source operationally. Suggested values:
#     upstream_download      = authoritative source that setup.py/Snakemake may download/cache.
#     manual_download        = authoritative source, but user must place it locally.
#     external_model_output  = output from another model, e.g. RAMP-mobility; validate/consume only.
#     external_workbook      = workbook/tool such as GREET; may require extraction maps.
#     legacy_artifact        = legacy workbook/script/database used as evidence or validation target.
#     derived_intermediate   = produced by this backend from another registered source.
#     user_defined           = scenario/policy assumption authored inside this repo.
#
# file_type:
#   Expected physical format at `path`, e.g. csv, xlsx, xlsm, sqlite, parquet, zip,
#   directory, or a small list-like string such as xlsx_or_csv while the source is unresolved.
#   This is useful for validation and for choosing the right extraction method.
#
# path:
#   Repo-relative local cache/input path. Prefer separating source categories:
#     inputs/0_cache/...             for downloaded authoritative upstream data.
#     inputs/0_external_models/...   for external model outputs not generated here.
#     legacy_backend/...     for legacy evidence retained for reproduction/validation.
#     outputs/intermediate/... for files generated by this backend.
#
# cache_path_template:
#   Cache filename template relative to paths.yaml `inputs.cache`. Prefer this over
#   embedding `inputs/0_cache` in source entries so cache roots remain path-configurable.
#
# url:
#   Canonical download/API page/file URL when the backend can or should fetch the source.
#   Use null for manual/external/legacy sources until the exact authoritative URL is known.
#   If multiple files are required, consider replacing `url` later with `urls:`.
#
# access:
#   Optional reusable metadata for non-static source discovery. For Ontario Data Catalogue
#   CKAN packages, use:
#
#     access:
#       method: ckan_package
#       ckan_base_url: "https://data.ontario.ca"
#       package_id: "..."
#       resource_selector:
#         format: zip
#         year_fields: [name, url]
#
#   The workflow should query CKAN package metadata, select the requested year's resource
#   by reusable selector rules, then cache the resolved file under `cache_path_template`.
#
# version:
#   Data-source version, release year, scenario name, model version, or table vintage.
#   Examples: "CEUD 2024 release", "AEO 2025", "GREET 2024", "RAMP run 2023-10-14".
#   This is distinct from the top-level YAML schema version.
#
# units:
#   Native units in the raw source, or a compact note if the source contains mixed units.
#   Keep target Temoa units in parameter/extraction metadata; this field is source-native.
#
# citation:
#   Preferred citation string or short bibliographic note. This should eventually feed
#   DataSource-style metadata and validation reports, but it can start as plain text.
#
# validation_rule:
#   Short, human-readable statement of what must be true before the source is considered
#   available. Early on this can be prose; later it can point to a named validation check.
#   Examples: expected sheets exist, expected CSV columns exist, row counts are nonzero,
#   profile sums/normalization are within tolerance, required regions are present.
#
# refresh_notes:
#   Practical instructions for updating the source. Include known fragilities, manual steps,
#   legacy locations, table numbers, workbook sheets, or assumptions that a future modeler
#   should verify during an annual update.
#
# Source component collections: tables, reports, articles, xlsx, or similar
#   Use a component collection when one registered source represents a family of
#   related raw inputs rather than a single undifferentiated dataset. Name the
#   collection for the source's native grouping only when useful, e.g. `tables:`
#   for CEUD table IDs or `reports:` for Ontario vehicle population reports.
#   The internal metadata should still follow the same tracking contract across
#   collections, regardless of the source-native structure.
#
#   Example: NRCan transport files vary by year, region, and table_id:
#
#     tran_{region}_e_{table_id}.xls
#
#   Example: Ontario vehicle population ZIP archives contain multiple report TXT
#   members, but only Reports 4 and 5 are currently consumed.
#
#   Keep one top-level source entry for the source family, then describe each
#   component under the chosen collection key. Each component entry should say
#   exactly what raw concepts are being fetched, which transport classes they
#   apply to, what intermediate backend products they are intended to produce,
#   and which parameter module is expected to consume them.
#
#   Required component-entry fields:
#     label:
#       Human-readable source component name.
#
#     short_name:
#       Stable snake_case identifier used in logs, extraction outputs, and tests.
#       This should describe the component's backend role, not just repeat the label.
#
#     inputs:
#       Exact raw concepts fetched from the source component, e.g. stock, sales,
#       activity, fuel_use, avg_distance, occupancy, load_factor, fuel_split,
#       vehicle_model_year, weight_class, registration_status_count, or kg_bounds.
#
#     applies_to:
#       Transport modes, subsectors, or technology groups covered by the component,
#       e.g. cars, light_trucks, medium_trucks, passenger_air, freight_rail,
#       transit_buses, or motorcycles.
#
#     produces:
#       Intended intermediate backend quantities this component helps derive, e.g.
#       demand, existing_capacity, fleet_turnover, utilization_from_stock,
#       occupancy_from_activity, stock_from_activity, fuel_type_disaggregation,
#       vehicle_age_distribution, or epa_gvwr_distribution.
#
#     parameter_modules:
#       Parameterization modules expected to consume this component.
#
#   Optional component-entry fields:
#     raw_member_template, path_template, sheet, table_id, report_id:
#       Source-native locator details. Keep these alongside the shared tracking
#       fields, not instead of them.
#
#     notes:
#       Short caveat or legacy interpretation note. Keep detailed transformations
#       in config/parameters/ or extraction maps, not here.
#
#     validation_rule:
#       Component-specific availability/shape check if the top-level source rule is
#       too generic.
#
#     units:
#       Native units if this component has clearer units than the parent source.
#
# What not to put here yet
# -----------------------
# Avoid turning sources.yaml into a full parameter-definition file. It should not contain
# every Excel cell/range, transformation equation, or target SQLite table. Put those in
# extraction maps or parameter configs once the source registry is stable, for example:
#   config/extraction_maps/nrcan_ceud_transport.yaml
#   config/extraction_maps/legacy_transport_workbooks.yaml
#   config/parameters/stocks_and_demands.yaml
#
# Practical v2.0 recommendation
# -----------------------------
# Keep the fields below for now. The only fields I would consider optional at this stage
# are `checksum` and `date_accessed`, but keeping them as null placeholders is useful
# because they remind you what the reproducible workflow should eventually verify.

sources:
  nrcan_ceud_transport_provincial:
    title: "NRCan Comprehensive Energy Use Database Transportation Sector provincial tables"
    status: pending
    source_type: upstream_download
    file_type: xls
    url_template: "https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/data_e/downloads/comprehensive/Excel/{year}/tran_{region}_e_{table_id}.xls"
    cache_path_template: "nrcan_ceud_transport/{year}_tran_{region}_e_{table_id}.xls"
    years:
      default: 2021
    regions:
      default: "ON"    # any or all provinces
      allowed: ["AB", "BCT", "MB", "NB", "NL", "NS", "ON", "PE", "QC", "SK"]
    units: "varies"
    citation: "Natural Resources Canada. (2025). Transportation Sector – Ontario. Government of Canada, Natural Resources Canada. https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/menus/trends/comprehensive/trends_tran_on.cfm"
    validation_rule: "For each requested year-region-table_id, confirm file exists, can be opened, and contains expected CEUD table structure."
    refresh_notes: >
      Legacy workflow used get_nrcan_data.py to download CEUD transport Tables 7, 20-21, and 28-37, strip formatting/noise rows, and inject cleaned arrays
      into the transport spreadsheet Background Data sheet.
    tables:
      21:
        label: "Car Explanatory"
        short_name: car_fleet
        inputs: [sales, stock, avg_distance]
        applies_to: [cars]
        produces: [fleet_turnover, occupancy_from_activity]
        parameter_modules: [stocks_and_demands]
      37:
        label: "Truck Explanatory"
        short_name: truck_fleet
        inputs: [sales, stock, fleet_efficiency, avg_distance]
        applies_to: [passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks]
        produces: [fleet_turnover, md_truck_efficiency, hd_truck_efficiency, occupancy_from_activity]
        parameter_modules: [stocks_and_demands, on_road_effs_and_costs]
      31:
        label: "Bus Explanatory"
        short_name: bus_fleet
        inputs: [stock, avg_distance]
        applies_to: [school_buses, urban_transit, inter_city_buses]
        produces: [fleet_size, occupancy_from_activity]
        parameter_modules: [stocks_and_demands]
      20:
        label: "Cars"
        short_name: car_activity
        inputs: [activity]
        applies_to: [cars]
        produces: [demand, utilization_from_stock]
        parameter_modules: [stocks_and_demands]
      34:
        label: "Passenger Light Trucks"
        short_name: passenger_light_trucks_activity
        inputs: [activity]
        applies_to: [passenger_light_trucks]
        produces: [demand, utilization_from_stock]
        parameter_modules: [stocks_and_demands]
      35:
        label: "Freight Light Trucks"
        short_name: freight_light_trucks_activity
        inputs: [activity]
        applies_to: [freight_light_trucks]
        produces: [demand, utilization_from_stock]
        parameter_modules: [stocks_and_demands]
      36:
        label: ["Medium Trucks", "Heavy Trucks"]
        short_name: medium_heavy_trucks_activity
        inputs: [activity]
        applies_to: [medium_trucks, heavy_trucks]
        produces: [demand, utilization_from_stock]
        parameter_modules: [stocks_and_demands]
      32:
        label: "Motorcycle"
        short_name: motorcycle_fleet_activity
        inputs: [activity, stock, avg_distance]
        applies_to: [motorcycles]
        produces: [demand, utilization_from_stock, fleet_size, occupancy_from_activity]
        parameter_modules: [stocks_and_demands]
      28:
        label: "School Buses"
        short_name: school_buses_activity
        inputs: [activity, fuel_use]
        applies_to: [school_buses]
        produces: [demand, utilization_from_stock, fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
      29:
        label: "Urban Transit"
        short_name: urban_transit_activity
        inputs: [activity, fuel_use]
        applies_to: [urban_transit]
        produces: [demand, utilization_from_stock, fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
      30:
        label: "Inter-City Buses"
        short_name: inter_city_buses_activity
        inputs: [activity, fuel_use]
        applies_to: [inter_city_buses]
        produces: [demand, utilization_from_stock, fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
      14:
        label: "Passenger Air"
        short_name: passenger_air_provincial_fuel_use
        inputs: [fuel_use]
        applies_to: [passenger_air]
        produces: [stock_from_activity, fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
      15:
        label: "Freight Air"
        short_name: freight_air_provincial_fuel_use
        inputs: [fuel_use]
        applies_to: [freight_air]
        produces: [stock_from_activity, fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
      17:
        label: "Passenger Rail"
        short_name: passenger_rail_provincial_fuel_use
        inputs: [fuel_use]
        applies_to: [passenger_rail]
        produces: [stock_from_activity]
        parameter_modules: [stocks_and_demands]
      18:
        label: "Freight Rail"
        short_name: freight_rail_provincial_fuel_use
        inputs: [fuel_use]
        applies_to: [freight_rail]
        produces: [stock_from_activity]
        parameter_modules: [stocks_and_demands]
      19:
        label: "Marine Freight"
        short_name: marine_freight_provincial_fuel_use
        inputs: [fuel_use]
        applies_to: [marine_freight]
        produces: [stock_from_activity, fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
      7:
        label: "Off-Road"
        short_name: off_road_fuel_use
        inputs: [fuel_use]
        applies_to: [off_road]
        produces: [demand]
        parameter_modules: [stocks_and_demands]

  nrcan_ceud_transport_national:
    title: "NRCan Comprehensive Energy Use Database Transportation Sector national tables"
    status: pending
    source_type: upstream_download
    file_type: xls
    url_template: "https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/data_e/downloads/comprehensive/Excel/{year}/tran_ca_e_{table_id}.xls"
    cache_path_template: "nrcan_ceud_transport/{year}_tran_ca_e_{table_id}.xls"
    years:
      default: 2021
    regions:
      default: "global"   # CANOE label for national-level data
    units: "varies"
    citation: "Natural Resources Canada. (2025). Transportation Sector – Canada. Government of Canada, Natural Resources Canada. https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/menus/trends/comprehensive/trends_tran_ca.cfm"
    validation_rule: "For each requested year-table_id, confirm file exists, can be opened, and contains expected CEUD table structure."
    refresh_notes: >
      Legacy workflow used CEUD transport Tables 14-19 directly in the transport spreadsheet Background Data sheet.
    tables:
      20:
        label: "Passenger Air"
        short_name: passenger_air_national_activity
        inputs: [activity, fuel_use]
        applies_to: [passenger_air]
        produces: [demand, fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
      15:
        label: "Freight Air"
        short_name: freight_air_national_activity
        inputs: [activity, fuel_use]
        applies_to: [freight_air]
        produces: [demand, fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]
      17:
        label: "Passenger Rail"
        short_name: passenger_rail_national_activity
        inputs: [activity, fuel_use]
        applies_to: [passenger_rail]
        produces: [demand]
        parameter_modules: [stocks_and_demands]
      18:
        label: "Freight Rail"
        short_name: freight_rail_national_activity
        inputs: [activity, fuel_use]
        applies_to: [freight_rail]
        produces: [demand]
        parameter_modules: [stocks_and_demands]
      19:
        label: "Marine Freight"
        short_name: marine_freight_national_activity
        inputs: [activity, fuel_use]
        applies_to: [marine_freight]
        produces: [demand, fuel_type_disaggregation]
        parameter_modules: [stocks_and_demands]

  ontario_ministry_transport_vehicle_population:
    title: "Ontario Ministry of Transportation vehicle population data"
    status: pending
    source_type: upstream_download
    file_type: zip
    access:
      method: ckan_package
      ckan_base_url: "https://data.ontario.ca"
      package_id: vehicle-population-data
      resource_selector:
        format: zip
        year_fields: [name, url]
    cache_path_template: "ontario_vehicle_population/{year}_vehicle_population_data.zip"
    years:
      default: 2022
    reports:
      4:
        label: "Report 4: vehicle weight class by registration status"
        raw_member_template: "{year}_Reg_Veh_Report4_Weight_Class&Status.TXT"
        short_name: commercial_vehicle_weight_classes
        inputs: [weight_class, fit_active_stock]
        applies_to: [medium_trucks, heavy_trucks]
        produces: [epa_vehicle_weight_distribution]
        parameter_modules: [on_road_effs_and_costs, on_road_variable_costs]
      5:
        label: "Report 5: vehicle class by registration status and descriptor"
        raw_member_template: "{year}_Reg_Veh_Report5_Class&Status&Descriptors.TXT"
        short_name: vehicle_age_distribution_by_class
        inputs: [vehicle_class, vehicle_model_year, fit_active_stock]
        applies_to: [cars, passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks, motorcycles, transit_buses, school_buses, inter_city_buses]
        produces: [fleet_age_distribution]
        parameter_modules: [stocks_and_demands]
    units: "Report 5: vehicle counts by registration status; Report 4: vehicle counts by weight bounds in kg"
    citation: "Ontario Ministry of Transportation. (2025). Vehicle population data—Ontario Data Catalogue [Dataset]. https://data.ontario.ca/dataset/vehicle-population-data"
    validation_rule: "CKAN package metadata must contain one ZIP resource for the requested year, with Report 4 and Report 5 TXT members present in the archive."
    refresh_notes: >
      Source ZIP URLs are CKAN resources and may change by release. Discover resources from the Ontario Data Catalogue package metadata instead of hardcoding resource URLs. 
      Legacy workflow uses data year 2022 and only Reports 4 and 5.

  statcan_transport_tables:
    title: "Statistics Canada transportation tables"
    status: pending
    source_type: upstream_download
    file_type: zip
    access:
      method: statcan_wds_full_table_csv
      language: en
      cube_metadata_url: "https://www150.statcan.gc.ca/t1/wds/rest/getCubeMetadata"
      full_table_url_template: "https://www150.statcan.gc.ca/t1/wds/rest/getFullTableDownloadCSV/{product_id}/{language}"
    cache_path_template: "statcan_transport/{product_id}-eng.zip"
    metadata_cache_path_template: "statcan_transport/{product_id}-metadata.json"
    units: varies by table and characteristic; preserve UOM and SCALAR_FACTOR
    citation: "Statistics Canada. Web Data Service and cited tables. https://www.statcan.gc.ca/en/developers/wds"
    validation_rule: "WDS metadata must match configured table titles/dimensions/members, and each resolved English full-table ZIP must contain its PID data CSV."
    refresh_notes: >
      Resolve current archive URLs through getFullTableDownloadCSV rather than DOI or
      table-viewer pages. Cache both cube metadata and the authoritative full-table ZIP.
    tables:
      "20-10-0021-01":
        product_id: 20100021
        title: "New motor vehicle registrations, inactive"
        frequency: annual
        coverage: "2011-2021"
        archive_status: archived
        citation: "Statistics Canada. Table 20-10-0021-01. https://doi.org/10.25318/2010002101-eng"
        intended_consumers: [stocks_and_demands]
        validation_rule: "Archived annual table must expose 2011-2021 geography, fuel type, LDV type, and number-of-vehicles series."
      "20-10-0025-01":
        product_id: 20100025
        title: "New motor vehicle registrations, quarterly, by geographic level"
        frequency: quarterly
        coverage: "2017-present"
        archive_status: current
        citation: "Statistics Canada. Table 20-10-0025-01. https://doi.org/10.25318/2010002501-eng"
        intended_consumers: [stocks_and_demands]
        validation_rule: "Current quarterly table must expose exact province-level geography, fuel type, LDV type, and number-of-vehicles series."
      "23-10-0308-01":
        product_id: 23100308
        title: "Vehicle registrations, by type of vehicle and fuel type"
        frequency: annual
        coverage: "2017-present"
        archive_status: current
        citation: "Statistics Canada. Table 23-10-0308-01. https://doi.org/10.25318/2310030801-eng"
        intended_consumers: [stocks_and_demands, road_aggregation]
        validation_rule: "Annual table must expose the 4,536-11,793 kg vehicle class, configured fuel types, and number-of-vehicles series by province."
      "34-10-0254-01":
        product_id: 34100254
        title: "Average expected useful life of new publicly owned public transit assets, Infrastructure Canada"
        frequency: occasional
        coverage: "2016, 2018, and 2020"
        archive_status: current
        citation: "Statistics Canada. Table 34-10-0254-01. https://doi.org/10.25318/3410025401-eng"
        intended_consumers: [lifetimes_survival]
        validation_rule: "Occasional table must expose the six configured bus asset useful-life members in average years by province."
      "23-10-0142-01":
        product_id: 23100142
        title: "Origin and destination of transported commodities, Canadian Freight Analysis Framework"
        frequency: annual
        coverage: "2011-2017"
        archive_status: current
        citation: "Statistics Canada. Table 23-10-0142-01. https://doi.org/10.25318/2310014201-eng"
        intended_consumers: [road_aggregation]
        validation_rule: "Annual table must expose origin, destination, Truck (for-hire), every commodity group, and shipments/weight/distance/tonne-kilometre characteristics."
