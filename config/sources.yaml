# External-source registry.
#
# Each `sources` entry owns one external family's identity, release, access/cache
# contract, source-native units, citation, refresh notes, availability checks, and
# reviewed data-quality metadata. `components` describe the source-native datasets and
# their intended downstream roles. Source-specific discovery fields belong only under
# `adapter` and are validated by the adapter that consumes them.
#
# DQ is represented by the named v4 fields `dq_cred`, `dq_geog`, `dq_struc`, `dq_tech`,
# and `dq_time`. Each source explicitly owns its scores; null means awaiting review.
# Each null indicator resolves to the registry fallback of 5 for ordinary builds.
# Explicit component scores take precedence over explicit source scores; remaining
# indicators inherit the fallback. Placeholders remain visible here for later review.
# `database_note` populates SQLite data_source.notes and is appended to parameter-row
# notes for the contributors actually used. Source text heads each labelled block;
# component notes appear beneath it. database_note_variants hold conditional caveats.
# database_note_keys retain each distinct treatment once per configured parameter key.
# These pre-annotations assess registered evidence, not every scenario application.
# Unresolved judgments remain null; explicit scores use the existing v4 scale
# (1 excellent, 2 good, 3 acceptable, 4 lacking, 5 unacceptable).
# `refresh_notes` and component `notes` document acquisition/evidence and are not copied
# into that database field.
# Every registered external source/component intended to support final parameter rows
# resolves the full applicable contract through component/source annotations and the
# registry fallback before insertion. DQ is source-owned, reviewable provenance evidence, not
# optional metadata. `dq_time` assessments use actual observation/value years and
# applicability to modelled time under the pinned data_quality_time descriptions.
# Publication dates and monetary dollar years are not data years. The schema defines
# qualitative applicability, not numeric age thresholds or automatic wall-clock decay.
# Research/methodology sources without an accepted model-time use remain unassessed.
#
# Extraction selectors, mappings, formulas, bins, and interim output names belong in
# `config/parameters/rules.yaml`; run-specific years/trajectories belong in scenario YAML.
# Regional fleet aggregation selections belong in each scenario's `aggregation_sources`.
# Backend-owned templates are not external sources and do not belong in this registry.
#
# database_precedence selects data_source and its existing component/source DQ for the
# named parameter table, optionally scoped by actual components, categories, sub_categories
# or technology_suffixes. Scopes combine; competing source matches are errors. If none
# applies, the builder's explicit native governor remains. Notes retain every contributor.
#
# Stable `source_id` values preserve database provenance across source-family renames
# and retired registrations. Keep edition details in version/access metadata.

version: 3

defaults:
  required: true
  component_required: true
  # First row per identity and distinct source/component treatment; differences retain a note.
  database_note_keys:
    capacity_factor_tech: [season, region]
    cost_invest: [tech, region]
    cost_fixed: [tech, region]
    cost_variable: [tech, region]
    demand: [commodity, region]
    efficiency: [tech, region]
    existing_capacity: [tech, region]
    lifetime_tech: [tech, region]
    lifetime_survival_curve: [tech, region]
    limit_annual_capacity_factor: [tech_or_group, region]
    limit_tech_input_split: [tech, region]
    limit_tech_input_split_annual: [tech, region]
    limit_new_capacity_share: [sub_group, region]
    emission_embodied: [tech, emis_comm, region]
  data_quality: {dq_cred: 5, dq_geog: 5, dq_struc: 5, dq_tech: 5, dq_time: 5}

sources:
  nrcan_ceud_transport_provincial:
    source_id: T01
    title: "NRCan Comprehensive Energy Use Database Transportation Sector provincial tables"
    status: active
    source_type: upstream_download
    file_type: xls
    version: "2025"
    units: "varies"
    citation: "Natural Resources Canada. (2025). Transportation Sector – Ontario. Government of Canada, Natural Resources Canada. https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/menus/trends/comprehensive/trends_tran_on.cfm"
    database_precedence:
      - table: existing_capacity
        categories: [cars, passenger_light_trucks, freight_light_trucks, motorcycles, medium_trucks, heavy_trucks, school_buses, urban_transit, inter_city_buses]
      - table: demand
        components: ['20', '34', '35', '36', '32', '28', '29', '30', '7']
      - table: limit_annual_capacity_factor
        categories: [cars, passenger_light_trucks, freight_light_trucks, motorcycles, medium_trucks, heavy_trucks, school_buses, urban_transit, inter_city_buses]
    database_note: "Provincial transport energy, activity and fleet statistics by vehicle class; aggregate series do not identify individual vehicle vintages or technologies."
    # dq_time: Annual observation years align with historical inputs and the selected base year.
    data_quality: {dq_cred: 2, dq_geog: 1, dq_struc: 2, dq_tech: 2, dq_time: 1}
    validation_rule: "For each requested year-region-table_id, confirm file exists, can be opened, and contains expected CEUD table structure."
    refresh_notes: >
      Legacy workflow used get_nrcan_data.py to download CEUD transport Tables 7, 20-21, and 28-37, strip formatting/noise rows, and inject cleaned arrays
      into the transport spreadsheet Background Data sheet.
    adapter:
      url_template: "https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/data_e/downloads/comprehensive/Excel/{year}/tran_{region}_e_{table_id}.xls"
      cache_path_template: "nrcan_ceud_transport/{year}_tran_{region}_e_{table_id}.xls"
      regions:
        allowed: ["AB", "BCT", "MB", "NB", "NL", "NS", "ON", "PE", "QC", "SK"]
    components:
      21:
        database_note: "Provincial car stock, sales and distance travelled; fleet totals require separate age and fuel evidence for technology cohorts."
        label: "Car Explanatory"
        short_name: car_fleet
        inputs: [sales, stock, average_distance]
        applies_to: [cars]
        produces: [fleet_turnover, occupancy_from_activity]
        parameter_modules: [road_stocks_and_demands]
      37:
        database_note: "Provincial passenger-light-truck, freight-light-truck and medium/heavy-truck fleet statistics; source classes pool vehicle sizes and powertrains."
        label: "Truck Explanatory"
        short_name: truck_fleet
        inputs: [sales, stock, fleet_efficiency, average_distance]
        applies_to: [passenger_light_trucks, freight_light_trucks, medium_trucks, heavy_trucks]
        produces: [fleet_turnover, md_truck_efficiency, hd_truck_efficiency, occupancy_from_activity]
        parameter_modules: [road_stocks_and_demands, road_efficiencies]
      31:
        database_note: "Provincial school, transit and inter-city bus stock and distance travelled; fuel-specific fleet counts are not reported."
        label: "Bus Explanatory"
        short_name: bus_fleet
        inputs: [stock, average_distance]
        applies_to: [school_buses, transit_buses, inter_city_buses]
        produces: [fleet_size, occupancy_from_activity]
        parameter_modules: [road_stocks_and_demands]
      20:
        database_note_variants:
          car_extrapolation: "Car activity follows historical growth; passenger-light-truck activity is the residual within the GDP-indexed passenger-LDV total."
        database_note: "Provincial passenger-car service activity in passenger-kilometres."
        label: "Cars"
        short_name: car_activity
        inputs: [activity]
        applies_to: [cars]
        produces: [demand, utilization_from_stock]
        parameter_modules: [road_stocks_and_demands]
      34:
        database_note: "Provincial passenger-light-truck service activity in passenger-kilometres."
        label: "Passenger Light Trucks"
        short_name: passenger_light_trucks_activity
        inputs: [activity]
        applies_to: [passenger_light_trucks]
        produces: [demand, utilization_from_stock]
        parameter_modules: [road_stocks_and_demands]
      35:
        database_note: "Provincial freight-light-truck service activity in tonne-kilometres."
        label: "Freight Light Trucks"
        short_name: freight_light_trucks_activity
        inputs: [activity]
        applies_to: [freight_light_trucks]
        produces: [demand, utilization_from_stock]
        parameter_modules: [road_stocks_and_demands]
      36:
        database_note: "Provincial medium- and heavy-truck freight activity in tonne-kilometres."
        label: ["Medium Trucks", "Heavy Trucks"]
        short_name: medium_heavy_trucks_activity
        inputs: [activity]
        applies_to: [medium_trucks, heavy_trucks]
        produces: [demand, utilization_from_stock]
        parameter_modules: [road_stocks_and_demands]
      32:
        database_note: "Provincial motorcycle stock, distance travelled and passenger activity."
        label: "Motorcycle"
        short_name: motorcycle_fleet_activity
        inputs: [activity, stock, average_distance]
        applies_to: [motorcycles]
        produces: [demand, utilization_from_stock, fleet_size, occupancy_from_activity]
        parameter_modules: [road_stocks_and_demands]
      28:
        database_note: "Provincial school-bus passenger activity and energy use by fuel; fuel activity shares are inferred separately."
        label: "School Buses"
        short_name: school_buses_activity
        inputs: [activity, fuel_use_by_source]
        applies_to: [school_buses]
        produces: [demand, utilization_from_stock, fuel_type_disaggregation]
        parameter_modules: [road_stocks_and_demands]
      29:
        database_note: "Provincial urban-transit passenger activity and energy use by fuel; fuel activity shares are inferred separately."
        label: "Urban Transit"
        short_name: urban_transit_activity
        inputs: [activity, fuel_use_by_source]
        applies_to: [transit_buses]
        produces: [demand, utilization_from_stock, fuel_type_disaggregation]
        parameter_modules: [road_stocks_and_demands]
      30:
        database_note: "Provincial inter-city-bus passenger activity and energy use by fuel; fuel activity shares are inferred separately."
        label: "Inter-City Buses"
        short_name: inter_city_buses_activity
        inputs: [activity, fuel_use_by_source]
        applies_to: [inter_city_buses]
        produces: [demand, utilization_from_stock, fuel_type_disaggregation]
        parameter_modules: [road_stocks_and_demands]
      14:
        database_note: "Provincial passenger-air energy use by fuel; aircraft counts and provincial passenger activity are not reported."
        data_quality: {dq_struc: 3, dq_tech: 3}
        label: "Passenger Air"
        short_name: passenger_air_provincial_fuel_use_by_source
        inputs: [fuel_use_by_source]
        applies_to: [passenger_air]
        produces: [stock_from_activity, fuel_type_disaggregation]
        parameter_modules: [offroad_stocks_and_demands]
      15:
        database_note: "Provincial freight-air energy use by fuel; aircraft counts and provincial freight activity are not reported."
        data_quality: {dq_struc: 3, dq_tech: 3}
        label: "Freight Air"
        short_name: freight_air_provincial_fuel_use_by_source
        inputs: [fuel_use_by_source]
        applies_to: [freight_air]
        produces: [stock_from_activity, fuel_type_disaggregation]
        parameter_modules: [offroad_stocks_and_demands]
      17:
        database_note: "Provincial passenger-rail energy use; fleet capacity and passenger activity require separate intensity evidence."
        data_quality: {dq_struc: 3, dq_tech: 3}
        label: "Passenger Rail"
        short_name: passenger_rail_provincial_fuel_use_by_source
        inputs: [fuel_use_by_source]
        applies_to: [passenger_rail]
        produces: [stock_from_activity]
        parameter_modules: [offroad_stocks_and_demands]
      18:
        database_note: "Provincial freight-rail energy use; fleet capacity and freight activity require separate intensity evidence."
        data_quality: {dq_struc: 3, dq_tech: 3}
        label: "Freight Rail"
        short_name: freight_rail_provincial_fuel_use_by_source
        inputs: [fuel_use_by_source]
        applies_to: [freight_rail]
        produces: [stock_from_activity]
        parameter_modules: [offroad_stocks_and_demands]
      19:
        database_note: "Provincial marine-freight energy use by fuel; vessel capacity and freight activity require separate intensity evidence."
        data_quality: {dq_struc: 3, dq_tech: 3}
        label: "Marine Freight"
        short_name: freight_marine_provincial_fuel_use_by_source
        inputs: [fuel_use_by_source]
        applies_to: [freight_marine]
        produces: [stock_from_activity, fuel_type_disaggregation]
        parameter_modules: [offroad_stocks_and_demands]
      7:
        database_note: "Provincial off-road energy totals and fuel breakdown; aggregate PJ supplies the energy-only demand without inferring equipment stocks or transport service."
        label: "Off-Road"
        short_name: off_road_fuel_use_by_source
        inputs: [energy_use_by_mode, fuel_use_by_source]
        applies_to: [off_road]
        produces: [demand]
        parameter_modules: [offroad_stocks_and_demands]

