version: 1

root: "."

config:
  parameters: config/parameters

inputs:
  root: inputs
  cache: inputs/0_cache
  external: inputs/0_external_models
  manual: inputs/0_manual_params
  interim: inputs/1_interim
  processed: inputs/2_processed
  validation: inputs/validation
  template: inputs/0_canoe_template

outputs:
  root: outputs
  sqlite: outputs/sqlite
  validation: outputs/validation
  logs: outputs/logs

legacy:
  root: legacy_backend
  reference_sqlite: legacy_backend/canoe_on_12d_baseline.sqlite
  schema: legacy_backend/canoe_schema.sql
  transportation_compiler: legacy_backend/transportation[deprecated]/compile_transport.py
  charging_profiles: legacy_backend/charging_profiles[deprecated]
  constraints: legacy_backend/model_constraints[deprecated]

# Stable artifact-family routes for ownership and change-impact retrieval. These are
# intentionally coarser than module imports or individual files.
artifacts:
  charging_profiles_interim:
    path: inputs/1_interim/legacy_charging_profiles
    layer: interim
    owner: fetching.legacy_charging_profiles
    producers: [fetching.legacy_charging_profiles.normalize_profile]
    consumers: [parameterization.ldv_charging_profiles, reviewers]
    validation_surfaces: [fetching.legacy_charging_profiles.transform_hourly]
  charging_profiles_processed:
    path: inputs/2_processed/ldv_charging_profiles
    layer: processed
    owner: parameterization.ldv_charging_profiles
    producers: [parameterization.ldv_charging_profiles.prepare_charging_profile_rows]
    consumers: [build_transport, reviewers]
    validation_surfaces: [parameterization.ldv_charging_profiles.validate_charging_rows]
  charging_profiles_validation:
    path: inputs/validation/ldv_charging_profiles
    layer: input_validation
    owner: parameterization.ldv_charging_profiles
    producers: [parameterization.ldv_charging_profiles.prepare_charging_profile_rows]
    consumers: [reviewers]
    validation_surfaces: [parameterization.ldv_charging_profiles.validate_charging_rows]
  ldv_range_interim:
    path: inputs/1_interim/ldv_range_evidence
    layer: interim
    owner: fetching.epa_omega_baseline
    producers: [fetching.epa_omega_baseline.fetch_baseline]
    consumers: [parameterization.ldv_ev_ranges, reviewers]
    validation_surfaces: [fetching.epa_omega_baseline.normalize_baseline]
  omega_ldv_range_source:
    path: inputs/0_external_models/epa_omega_ldv_range_extract
    layer: external
    owner: fetching.epa_omega_baseline
    producers: [fetching.epa_omega_baseline.prepare_baseline_extract]
    consumers: [fetching.epa_omega_baseline, parameterization.ldv_ev_ranges, reviewers]
    validation_surfaces: [fetching.epa_omega_baseline.validate_extract]
  omega_baseline_validation:
    path: inputs/validation/epa_omega_baseline
    layer: input_validation
    owner: fetching.epa_omega_baseline
    producers: [fetching.epa_omega_baseline.prepare_baseline_extract]
    consumers: [reviewers]
    validation_surfaces: [fetching.epa_omega_baseline.prepare_baseline_extract]
  ldv_range_processed:
    path: inputs/2_processed/ldv_range_representation
    layer: processed
    owner: parameterization.ldv_ev_ranges
    producers: [parameterization.ldv_ev_ranges.prepare_range_rows, parameterization.ldv_ev_ranges.prepare_representative_parameters]
    consumers: [build_transport, reviewers]
    validation_surfaces: [parameterization.ldv_ev_ranges.validate_share_evidence, parameterization.ldv_ev_ranges.validate_representative_preparation]
  ldv_range_validation:
    path: inputs/validation/ldv_range_representation
    layer: input_validation
    owner: parameterization.ldv_ev_ranges
    producers: [parameterization.ldv_ev_ranges.build_range_evidence, parameterization.ldv_ev_ranges.prepare_representative_parameters]
    consumers: [reviewers]
    validation_surfaces: [parameterization.ldv_ev_ranges.validate_share_evidence]
  greet_vehicle_cycle_results:
    path: inputs/0_external_models/greet_vehicle_cycle_results
    layer: external
    owner: fetching.greet_automation
    producers: [fetching.greet_automation.generate_vehicle_cycle_results]
    consumers: [fetching.greet_vehicle_cycle, reviewers]
    validation_surfaces: [fetching.greet_vehicle_cycle.normalize_generated_results]
  greet_automation_validation:
    path: inputs/validation/greet_automation
    layer: input_validation
    owner: fetching.greet_automation
    producers: [fetching.greet_automation.generate_vehicle_cycle_results]
    consumers: [reviewers]
    validation_surfaces: [fetching.greet_automation.validate_probe_results]
  greet_vehicle_cycle_interim:
    path: inputs/1_interim/greet_vehicle_cycle
    layer: interim
    owner: fetching.greet_vehicle_cycle
    producers: [fetching.greet_vehicle_cycle.normalize_generated_results]
    consumers: [parameterization.road_embodied_emissions, reviewers]
    validation_surfaces: [fetching.greet_vehicle_cycle.normalize_generated_results]
  emission_embodied_processed:
    path: inputs/2_processed/emission_embodied
    layer: processed
    owner: parameterization.road_embodied_emissions
    producers: [parameterization.road_embodied_emissions.prepare_emission_embodied_rows]
    consumers: [build_transport, reviewers]
    validation_surfaces: [parameterization.road_embodied_emissions.validate_embodied_outputs]
  emission_embodied_validation:
    path: inputs/validation/emission_embodied
    layer: input_validation
    owner: parameterization.road_embodied_emissions
    producers: [parameterization.road_embodied_emissions.prepare_emission_embodied_rows]
    consumers: [reviewers]
    validation_surfaces: [parameterization.road_embodied_emissions.validate_embodied_outputs]
  ontario_vehicle_population:
    path: inputs/1_interim/fetched_ontario_vehicle_population
    layer: interim
    owner: fetching.vehicle_population
    producers: [fetching.vehicle_population.fetch_and_normalize]
    consumers:
      - parameterization.road_aggregation
      - parameterization.road_fleet_weights
      - parameterization.road_lifetimes_survival.build_mto_survival_diagnostic_artifacts
    validation_surfaces: [fetching.vehicle_population.validate_source]
  vehicle_survival_interim:
    path: inputs/1_interim/vehicle_survival
    layer: interim
    owner: parameterization.road_lifetimes_survival
    producers:
      - parameterization.road_lifetimes_survival.build_mto_survival_diagnostic_artifacts
      - parameterization.road_lifetimes_survival.build_lifetime_artifacts
    consumers: [reviewers]
    validation_surfaces: [parameterization.road_lifetimes_survival.transition_findings]
  road_aggregation:
    path: inputs/2_processed/road_aggregation
    layer: processed
    owner: parameterization.road_aggregation
    producers: [parameterization.road_aggregation.build_road_aggregation_artifacts]
    consumers:
      - parameterization.road_lifetimes_survival.build_accepted_lifetime_artifacts
      - parameterization.road_lifetimes_survival.build_mto_survival_diagnostic_artifacts
      - parameterization.build_lifetime_parameters.prepare_lifetime_rows
      - parameterization.road_stocks_and_demands
      - parameterization.road_utilization
      - parameterization.road_fleet_weights
      - parameterization.build_efficiencies
      - parameterization.build_costs
      - parameterization.road_embodied_emissions
    validation_surfaces:
      - parameterization.road_aggregation.validate_vehicle_mapping
      - parameterization.road_aggregation.mapping_coverage
      - parameterization.road_fleet_weights.load_ldv_aggregation_weights
  road_lifetimes_survival:
    path: inputs/2_processed/road_lifetimes_survival
    layer: processed
    owner: parameterization.road_lifetimes_survival
    producers:
      - parameterization.road_lifetimes_survival.build_accepted_lifetime_artifacts
      - parameterization.road_lifetimes_survival.build_lifetime_artifacts
    consumers: [reviewers]
    validation_surfaces: [parameterization.road_lifetimes_survival.median_equivalent_lifetimes]
  lifetime_parameters:
    path: inputs/2_processed/lifetime_parameters
    layer: processed
    owner: parameterization.build_lifetime_parameters
    producers: [parameterization.build_lifetime_parameters.build_lifetime_parameter_artifacts]
    consumers: [build_transport, reviewers]
    validation_surfaces: [parameterization.build_lifetime_parameters.prepare_lifetime_rows]
  road_stocks_and_demands:
    path: inputs/2_processed/road_stocks_and_demands
    layer: processed
    owner: parameterization.road_stocks_and_demands
    producers: [parameterization.road_stocks_and_demands.build_existing_stock_age_artifacts]
    consumers: [parameterization.build_existing_capacity, reviewers]
    validation_surfaces: [parameterization.road_stocks_and_demands.derive_ldv_age_distributions]
  tc_ev_dashboard_interim:
    path: inputs/1_interim/fetched_transport_canada_ev_dashboard
    layer: interim
    owner: fetching.assorted_sources
    producers: [fetching.assorted_sources.fetch_and_normalize_tc_dashboard]
    consumers: [parameterization.build_existing_capacity, parameterization.road_stocks_and_demands, parameterization.ev_chargers]
    validation_surfaces: [fetching.assorted_sources.normalize_tc_ev_dashboard_table, fetching.assorted_sources.normalize_tc_public_chargers]
  existing_capacity_interim:
    path: inputs/1_interim/existing_capacity
    layer: interim
    owner: parameterization.build_existing_capacity
    producers: [parameterization.build_existing_capacity.build_existing_capacity_artifacts]
    consumers: [parameterization.build_existing_capacity, reviewers]
    validation_surfaces: [parameterization.build_existing_capacity.validate_capacity_inputs]
  existing_capacity_processed:
    path: inputs/2_processed/existing_capacity
    layer: processed
    owner: parameterization.build_existing_capacity
    producers: [parameterization.build_existing_capacity.build_existing_capacity_artifacts]
    consumers: [build_transport, parameterization.ev_chargers, reviewers]
    validation_surfaces: [parameterization.build_existing_capacity.prepare_existing_capacity_rows]
  existing_capacity_validation:
    path: inputs/validation/existing_capacity
    layer: input_validation
    owner: parameterization.build_existing_capacity
    producers: [parameterization.build_existing_capacity.build_existing_capacity_artifacts]
    consumers: [reviewers]
    validation_surfaces: [parameterization.build_existing_capacity.validate_capacity_outputs]
  ev_chargers_processed:
    path: inputs/2_processed/ev_chargers
    layer: processed
    owner: parameterization.ev_chargers
    producers: [parameterization.ev_chargers.prepare_ev_charger_rows]
    consumers: [build_transport, reviewers]
    validation_surfaces: [parameterization.ev_chargers.prepare_ev_charger_rows]
  ev_chargers_validation:
    path: inputs/validation/ev_chargers
    layer: input_validation
    owner: parameterization.ev_chargers
    producers: [parameterization.ev_chargers.prepare_ev_charger_rows]
    consumers: [reviewers]
    validation_surfaces: [parameterization.ev_chargers.prepare_ev_charger_rows]
  demand_processed:
    path: inputs/2_processed/demand
    layer: processed
    owner: parameterization.build_demand
    producers: [parameterization.build_demand.prepare_demand_rows]
    consumers: [build_transport, reviewers]
    validation_surfaces: [parameterization.build_demand.validate_demand_outputs]
  efficiencies_interim:
    path: inputs/1_interim/efficiencies
    layer: interim
    owner: parameterization.build_efficiencies
    producers: [parameterization.build_efficiencies.prepare_efficiency_rows]
    consumers: [parameterization.build_efficiencies, reviewers]
    validation_surfaces: [parameterization.build_efficiencies.validate_efficiency_outputs]
  efficiencies_processed:
    path: inputs/2_processed/efficiencies
    layer: processed
    owner: parameterization.build_efficiencies
    producers: [parameterization.build_efficiencies.prepare_efficiency_rows]
    consumers: [build_transport, reviewers]
    validation_surfaces: [parameterization.build_efficiencies.validate_efficiency_outputs]
  efficiencies_validation:
    path: inputs/validation/efficiencies
    layer: input_validation
    owner: parameterization.build_efficiencies
    producers: [parameterization.build_efficiencies.prepare_efficiency_rows]
    consumers: [reviewers]
    validation_surfaces: [parameterization.build_efficiencies.validate_efficiency_outputs]
  costs_interim:
    path: inputs/1_interim/transport_costs
    layer: interim
    owner: parameterization.build_costs
    producers: [parameterization.build_costs.prepare_cost_rows]
    consumers: [parameterization.build_costs, reviewers]
    validation_surfaces: [parameterization.build_costs.validate_cost_outputs]
  costs_processed:
    path: inputs/2_processed/transport_costs
    layer: processed
    owner: parameterization.build_costs
    producers: [parameterization.build_costs.prepare_cost_rows]
    consumers: [build_transport, reviewers]
    validation_surfaces: [parameterization.build_costs.validate_cost_outputs]
  costs_validation:
    path: inputs/validation/transport_costs
    layer: input_validation
    owner: parameterization.build_costs
    producers: [parameterization.build_costs.prepare_cost_rows]
    consumers: [reviewers]
    validation_surfaces: [parameterization.build_costs.validate_cost_outputs]
  road_utilization_processed:
    path: inputs/2_processed/road_utilization
    layer: processed
    owner: parameterization.road_utilization
    producers: [parameterization.road_utilization.prepare_road_utilization]
    consumers: [build_transport, reviewers]
    validation_surfaces: [parameterization.road_utilization.validate_road_utilization]
  road_utilization_validation:
    path: inputs/validation/road_utilization
    layer: input_validation
    owner: parameterization.road_utilization
    producers: [parameterization.road_utilization.prepare_road_utilization]
    consumers: [reviewers]
    validation_surfaces: [parameterization.road_utilization.validate_road_utilization]
  vehicle_mapping_review:
    path: inputs/validation/vehicle_mapping
    layer: input_validation
    owner: parameterization.vehicle_mapping_bootstrap
    producers:
      - parameterization.road_aggregation.build_mapping_diagnostic_artifacts
      - parameterization.vehicle_mapping_bootstrap.main
    consumers: [fetching.vpic_vehicle_types, fetching.vpic_model_years, reviewers]
    validation_surfaces:
      - parameterization.road_aggregation.mapping_coverage
      - parameterization.vehicle_mapping_bootstrap.bootstrap_coverage
  lifetime_validation:
    path: inputs/validation/lifetimes_survival
    layer: input_validation
    owner: parameterization.road_lifetimes_survival
    producers:
      - parameterization.road_lifetimes_survival.build_mto_survival_diagnostic_artifacts
      - parameterization.road_lifetimes_survival.build_lifetime_artifacts
      - parameterization.road_stocks_and_demands.build_existing_stock_age_artifacts
    consumers: [reviewers]
    validation_surfaces:
      - parameterization.road_lifetimes_survival.evaluate_mto_survival_decision
      - parameterization.road_lifetimes_survival.transition_findings
  database:
    path: outputs/sqlite
    layer: database
    owner: build_transport
    producers: [build_transport.build_from_scenario]
    consumers: [temoa, validation.legacy_compare, validation.sqlite_compare]
    validation_surfaces:
      - validation.schema_contract.create_v4_schema
      - validation.insertion.insert_models
      - validation.database_bootstrap.validate_database
      - validation.insertion.validate_transport_parameter_support
  database_validation:
    path: outputs/validation
    layer: output_validation
    owner: build_transport
    producers: [build_transport.build_from_scenario]
    consumers: [reviewers]
    validation_surfaces:
      - validation.database_bootstrap.validate_database
      - validation.legacy_compare.compare_legacy_tables
      - validation.sqlite_compare.compare_scenario_databases
