# Extraction and harmonization contracts for registered source artifacts.
#
# Each `parameterization` entry is consumed by its named adapter or parameter module and
# owns source-layout selectors, mappings, filters, bins, thresholds, normalization
# choices, and deterministic interim artifact names. Use stable keys, keep comments next
# to the value they explain, and add a focused consumer test for each new contract.
#
# External identity, access, citations, and physical availability checks belong in
# `config/sources.yaml`; run selections belong in scenario YAML; reusable numeric unit
# conversions belong in `conversion.yaml`.

version: 1

parameterization:
  manual_parameters:
    # Manual CSVs remain review-owned. This section controls only validation,
    # selector expansion, and auditable interim publication.
    interim_subdir: resolved_manual_parameters
    technology_template_file: technology.csv
    source_column: "source -> data_source"
    notes_column: notes
    technology_id_column: tech
    technology_class_column: technology_class
    technology_category_column: category
    technology_sub_category_column: sub_category
    powertrain_column: powertrain
    parameter_column: parameter
    wildcard_selector: all
    remainder_selector: remainder
    projection_year_pattern: '^(?P<base>.+)_(?P<year>(?:19|20)\d{2})$'
    unmatched_policy: report
    powertrain_aliases:
      jet_fuel: [jet_fuel, "jet fuel"]
      mdo: [mdo, "marine diesel oil"]
      hfo: [hfo, "heavy fuel oil"]
      electric: [electric, bev]
    registry_file: manual_parameter_registry.csv
    resolution_file: manual_parameter_technology_resolution.csv
    reconciliation_file: manual_parameter_reconciliation.csv
    findings_file: manual_parameter_findings.csv

  nrcan_ceud:
    interim_subdir: fetched_nrcan_ceud_inputs
    manifest_file: manifest.csv
    warnings_file: warnings.log
    empty_output_file: nrcan_ceud_transport_empty.csv
    region_output_template: nrcan_ceud_transport_{region}.csv
    raw_excel_skiprows: 10
    label_column_fallback_index: 1
    drop_columns_if_present: ["Unnamed: 0"]
    null_labels: ["nan", "n.a.", "na"]
    remove_label_characters: "Â¹Â²Â³¹²³"
    allowed_label_characters: "- /()|%"
    drop_raw_series_pattern: "Shares|GHG"
    group_header_value_rows:
      7: ["Total Energy Use (PJ)"]
    table_label_prefix_markers:
      - Activity
      - Energy Intensity
      - Energy Use by Energy Source

  nrcan_fuel_consumption_ratings:
    interim_subdir: fetched_nrcan_fuel_consumption_ratings
    manifest_file: manifest.csv
    warnings_file: warnings.log
    encoding_candidates: [utf-8-sig, cp1252]
    outputs:
      battery_electric_2012_2026: nrcan_battery_electric_vehicles_2012_2026.csv
      plug_in_hybrid_2012_2026: nrcan_plug_in_hybrid_electric_vehicles_2012_2026.csv
      fuel_consumption_1995_2014: nrcan_fuel_consumption_ratings_1995_2014.csv
      fuel_consumption_2015_2024: nrcan_fuel_consumption_ratings_2015_2024.csv
      fuel_consumption_2025: nrcan_fuel_consumption_ratings_2025.csv
      fuel_consumption_2026: nrcan_fuel_consumption_ratings_2026.csv
    vehicle_class_harmonization:
      target_source: nlr_atb_transportation_2024
      target_dimension: vehicle_class
      target_to_nrcan:
        Compact: [Minicompact, Subcompact, Compact]
        Midsize: [Mid-size, Full-size, Two-seater, "Station wagon: Small", "Station wagon: Mid-size"]
        Small SUV: ["Sport utility vehicle: Small"]
        Midsize SUV: ["Sport utility vehicle: Standard", Minivan]
        Pickup: ["Pickup truck: Small", "Pickup truck: Standard", "Van: Cargo", "Van: Passenger"]
      unresolved_nrcan_classes: [Special purpose vehicle, "Sport utility vehicle"]
      unmapped_policy: error
      historical_class_note: >-
        The 1995-2014 ratings use the unsplit Sport utility vehicle label and retain
        Van: Cargo. The generic SUV label does not distinguish the established Small
        versus Midsize SUV targets, so retain it only in source-normalized efficiency
        evidence and exclude it from NLR mapping inference. Treat cargo/passenger vans
        with pickups while retaining the source-native NRCan label in normalized evidence.

  fueleconomy_vehicle_data:
    interim_subdir: fetched_fueleconomy_vehicle_data
    output_file: fueleconomy_vehicle_class_evidence.csv
    manifest_file: manifest.csv
    warnings_file: warnings.log
    selected_columns: [year, make, model, VClass]
    output_columns:
      year: Model year
      make: Make
      model: Model
      VClass: Source vehicle class
    vclass_to_nrcan:
      Compact Cars: Compact
      Large Cars: Full-size
      Midsize Cars: Mid-size
      Minicompact Cars: Minicompact
      Subcompact Cars: Subcompact
      Two Seaters: Two-seater
      Small Station Wagons: "Station wagon: Small"
      Midsize Station Wagons: "Station wagon: Mid-size"
      Midsize-Large Station Wagons: "Station wagon: Mid-size"
      Minivan - 2WD: Minivan
      Minivan - 4WD: Minivan
