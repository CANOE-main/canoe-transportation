  nlr_atb_autonomie:
    interim_subdir: fetched_nlr_atb_autonomie
    manifest_file: manifest.csv
    warnings_file: warnings.log
    components:
      vehicles:
        output_file: atb_vehicles.csv
        phev_powertrain: Plug-in Hybrid
        phev_reconciliation_metrics:
          gge: "Fuel Economy (mi/gge)"
          dge: "Fuel Economy (mi/dge)"
        metric_keys:
          "Fuel Economy (mi/dge)": fuel_economy_mi_per_dge
          "Fuel Economy (mi/gge)": fuel_economy_mi_per_gge
          "Modeled Vehicle Price (2022$)": modeled_vehicle_price
          "Range (mi)": range_mi
          "Useable Energy (kWh)": usable_battery_capacity_kwh
        metric_units:
          "Fuel Economy (mi/dge)": mi/dge
          "Fuel Economy (mi/gge)": mi/gge
          "Modeled Vehicle Price (2022$)": 2022 USD/vehicle
          "Range (mi)": mi
          "Useable Energy (kWh)": kWh
      phev_efficiency:
        output_file: atb_phev_utility_weighted_efficiency.csv
        source_powertrain: Plug-in Hybrid
        light_duty_weight_category: Light Duty
        medium_heavy_weight_category: Medium/Heavy Duty
        source_fields:
          year: year
          source_scenario: scenario
          primary_fuel: fuel_category
          secondary_fuel: fuel2_category
          vehicle_weight_category: vehicle_weight_category
          vehicle_class: vehicle_class
          vehicle_powertrain: vehicle_powertrain
          vehicle_detail: vehicle_detail
          electric_range_mi: "range(mi)"
          source_combined_cs_fuel_economy_mi_per_gge: "CS(mi/gge)"
          source_combined_cd_electricity_consumption_wh_per_mi: "CD(Wh/mi)"
          vehicle_input_reference: reference
        source_key_fields: [year, scenario, fuel_category, fuel2_category, vehicle_weight_category, vehicle_class, vehicle_powertrain, vehicle_detail]
        fuel_equivalent_basis:
          Gasoline: gge
          Diesel: dge
        cycle_aggregation:
          cycles:
            ARB:
              contribution: ARB_contribution
              cs_fuel_economy: "ARB_CS(mpgde)"
              cd_electricity_consumption: "ARB_CD(Wh/mi)"
            EPA55:
              contribution: EPA55_contribution
              cs_fuel_economy: "EPA55_CS(mpgde)"
              cd_electricity_consumption: "EPA55_CD(Wh/mi)"
            EPA65:
              contribution: EPA65_contribution
              cs_fuel_economy: "EPA65_CS(mpgde)"
              cd_electricity_consumption: "EPA65_CD(Wh/mi)"
        utility_factor_matching:
          utility_factor_column: phev_uf
          reference_column: reference
          notes_column: notes
          ldv:
            source_family: phev_uf_ldv
            exact_key_fields: [vehicle_weight_category, "range(mi)"]
            interpolation_dimension: "range(mi)"
            interpolation_method: linear
            allow_extrapolation: false
          mdhd:
            source_family: phev_uf_mdhd
            exact_key_fields: [vehicle_weight_category, vehicle_class]
        reconciliation:
          output_key_fields: [year, scenario, fuel_category, fuel2_category, vehicle_weight_category, vehicle_class, vehicle_powertrain, vehicle_detail]
          derived_to_output_key_fields:
            year: year
            scenario: trajectory
            fuel_category: primary_fuel
            fuel2_category: secondary_fuel
            vehicle_weight_category: vehicle_weight_category
            vehicle_class: vehicle_class
            vehicle_powertrain: vehicle_powertrain
            vehicle_detail: vehicle_detail
          scenario_aliases:
            Constant: Conservative
          metric_by_basis:
            gge: "Fuel Economy (mi/gge)"
            dge: "Fuel Economy (mi/dge)"
          absolute_tolerance_mi_per_gallon_equivalent: 1.0e-9
          relative_tolerance: 1.0e-6
          policy: report_only
        tolerances:
          cycle_contribution_sum: 1.0e-9
          utility_factor_bounds: 1.0e-12
          input_share_sum: 1.0e-12
        conversion_keys:
          mile_to_km: [length, mile_to_km]
          us_gallon_to_litre: [volume, us_gallon_to_litre]
          wh_to_kwh: [energy, wh_to_kwh]
          wh_per_gge: [energy, wh_per_gge]
          wh_per_dge: [energy, wh_per_dge]
          gal_equivalent_per_mile_to_litre_equivalent_per_100_km: [derived, us_gallon_equivalent_per_mile_to_litre_equivalent_per_100_km]
          wh_per_mile_to_kwh_per_100_km: [derived, wh_per_mile_to_kwh_per_100_km]
        units:
          combined_cs:
            gge: mi/gge
            dge: mi/dge
          utility_weighted_fuel_source:
            gge: gge/mi
            dge: dge/mi
          utility_weighted_fuel_canadian:
            gge: Lge/100 km
            dge: Lde/100 km
          utility_weighted_electricity_source: Wh/mi
          utility_weighted_electricity_canadian: kWh/100 km
        future_nrcan_phev_contract:
          combined_cd_raw_column: "Combined Le/100 km"
          combined_cd_output_raw_field: combined_cd_consumption_Le_100_km_raw
          combined_cd_output_numeric_field: combined_cd_consumption_Le_100_km
          combined_cd_parse: leading_numeric_only
