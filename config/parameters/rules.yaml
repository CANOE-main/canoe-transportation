    representative:
      families:
        cars: {BEV: T_LDV_C_BEV_REP_N, PHEV: T_LDV_C_GSL_PHEV_REP_N, phev_blend: T_BLND_GSL_ELC_PHEV_C_REP, phev_commodity: T_gsl_elc_phev_c_rep}
        passenger_light_trucks: {BEV: T_LDV_LTP_BEV_REP_N, PHEV: T_LDV_LTP_GSL_PHEV_REP_N, phev_blend: T_BLND_GSL_ELC_PHEV_LTP_REP, phev_commodity: T_gsl_elc_phev_ltp_rep}
        freight_light_trucks: {BEV: T_LDV_LTF_BEV_REP_N, PHEV: T_LDV_LTF_GSL_PHEV_REP_N, phev_blend: T_BLND_GSL_ELC_PHEV_LTF_REP, phev_commodity: T_gsl_elc_phev_ltf_rep}
      efficiency: sales_weighted_consumption  # Harmonic efficiency; conserves PJ per service.
      costs: sales_weighted_same_capacity_and_service_units
      capacity_to_activity: require_identical
      utilization: require_identical
      fixed_lifetime: require_identical
      survival: sales_weighted_surviving_fraction
      survival_composition: require_identical_range_curves
      embodied: sales_weighted_lifetime_mass
      # User accepted a horizon mean, matching the existing NLR endpoint averaging.
      # Component fuel use by vintage is approximate; total PJ/service is conserved.
      phev_split: mean_vintage_consumption_weighted_energy_share
      equality_tolerance: 1.0e-12
      fuel_commodity: T_gsl
      electricity_commodity: T_elc_ldv_chrg
      parameter_file: representative_parameters.json
      audit_file: representative_conservation.json
    files:
      records: sales_range_records.csv
      unresolved: unresolved_sales.csv
      buckets: sales_bucket_totals.csv
      integrity: integrity.json
      constraints: limit_new_capacity_share.csv
      groups: tech_group.csv
      members: tech_group_member.csv
      decisions: representative_decisions.json
  ev_chargers:
    transformation_version: "4"
    utilization_time_basis: technology_kind
    utilization:
      ldv:
        source_period: {existing: "2025", new: remainder}  # Reviewed utilization: 0.15 existing, 0.20 new, for every vintage.
        operator: ge
        floor_multiplier: 0.98  # Annual floor slack; profile mean retains the full utilization target.
        without_profile: {operator: e, floor_multiplier: 1.0}  # No hourly ceiling: set exact annual utilization.
      mhdv:
        source_period: {existing: all, new: all}  # Reviewed utilization: 0.30, without an hourly profile.
        operator: e
        floor_multiplier: 1.0  # Equality uses the full reviewed utilization.
    manual_file: charger_parameters.csv
    capacity_to_activity_file: capacity_to_activity.csv
    capacity_to_activity_units: PJ/GW
    capacity_to_activity_output_file: charger_capacity_to_activity.csv
