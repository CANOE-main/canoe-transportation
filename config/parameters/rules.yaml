          external_methods: [reviewed_external_model_vin_family_association]
        # MY2019 includes pre-launch acquisitions; MY2025 was truncated by suspension.
        # Eligible incentives are a composition proxy, not complete market counts.
        izev_model_year_min: 2020
        izev_model_year_max: 2024
