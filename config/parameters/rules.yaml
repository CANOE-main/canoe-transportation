    province_map:
      "Alberta": AB
      "British Columbia": BC
      "Manitoba": MB
      "New Brunswick": NB
      "Newfoundland and Labrador": NL
      "Nova Scotia": NS
      "Northwest Territories": NT
      "Nunavut": NU
      "Ontario": 'ON'
      "Prince Edward Island": PE
      "Quebec": QC
      "Saskatchewan": SK
      "Yukon": YT

  nrcan_fuel_consumption_ratings:
    interim_subdir: fetched_nrcan_fuel_consumption_ratings
    manifest_file: manifest.csv
    warnings_file: warnings.log
    encoding_candidates: [utf-8-sig, cp1252]
    outputs:
      battery_electric_2012_2026: nrcan_battery_electric_vehicles_2012_2026.csv
      plug_in_hybrid_2012_2026: nrcan_plug_in_hybrid_electric_vehicles_2012_2026.csv
      fuel_consumption_1995_2014: nrcan_fuel_consumption_ratings_1995_2014.csv
      fuel_consumption_2015_2024: nrcan_fuel_consumption_ratings_2015_2024.csv
      fuel_consumption_2025: nrcan_fuel_consumption_ratings_2025.csv
      fuel_consumption_2026: nrcan_fuel_consumption_ratings_2026.csv
    vehicle_class_harmonization:
      target_to_nrcan:
        Compact: [Minicompact, Subcompact, Compact]
        Midsize: [Mid-size, Full-size, Two-seater, "Station wagon: Small", "Station wagon: Mid-size"]
        Small SUV: ["Sport utility vehicle: Small"]
        Midsize SUV: ["Sport utility vehicle: Standard", Minivan]
        Pickup: ["Pickup truck: Small", "Pickup truck: Standard", "Van: Cargo", "Van: Passenger"]
      unresolved_nrcan_classes: [Special purpose vehicle, "Sport utility vehicle"]
      unmapped_policy: error
      target_to_ceud:
        Compact: Car
        Midsize: Car
        Small SUV: Light Truck
        Midsize SUV: Light Truck
        Pickup: Light Truck
      # The 1995-2014 ratings use the unsplit Sport utility vehicle label and retain
      # Van: Cargo. The generic SUV label does not distinguish the established Small
      # versus Midsize SUV targets, so retain it only in source-normalized efficiency
      # evidence and exclude it from NLR mapping inference. Treat cargo/passenger vans
      # with pickups while retaining the source-native NRCan label in normalized evidence.

  fueleconomy_vehicle_data:
    interim_subdir: fetched_fueleconomy_vehicle_data
    output_file: fueleconomy_vehicle_class_evidence.csv
    manifest_file: manifest.csv
    warnings_file: warnings.log
    range_output_file: fueleconomy_my2024_range_evidence.csv
    range_manifest_file: range_manifest.csv
    range_model_year: 2024
    range_powertrain_map: {EV: BEV, Plug-in Hybrid: PHEV}
    bev_range_column: range
    phev_range_column: rangeA
    electricity_label: Electricity
    selected_columns: [year, make, model, VClass]
    output_columns:
      year: Model year
      make: Make
      model: Model
      VClass: Source vehicle class
    vclass_to_nrcan:
      Compact Cars: Compact
      Large Cars: Full-size
      Midsize Cars: Mid-size
      Minicompact Cars: Minicompact
      Subcompact Cars: Subcompact
      Two Seaters: Two-seater
      Small Station Wagons: "Station wagon: Small"
      Midsize Station Wagons: "Station wagon: Mid-size"
      Midsize-Large Station Wagons: "Station wagon: Mid-size"
      Minivan - 2WD: Minivan
      Minivan - 4WD: Minivan
      Small Pickup Trucks: "Pickup truck: Small"
      Small Pickup Trucks 2WD: "Pickup truck: Small"
      Small Pickup Trucks 4WD: "Pickup truck: Small"
      Standard Pickup Trucks: "Pickup truck: Standard"
      Standard Pickup Trucks 2WD: "Pickup truck: Standard"
      Standard Pickup Trucks 4WD: "Pickup truck: Standard"
      Standard Pickup Trucks/2wd: "Pickup truck: Standard"
      Small Sport Utility Vehicle 2WD: "Sport utility vehicle: Small"
      Small Sport Utility Vehicle 4WD: "Sport utility vehicle: Small"
      Standard Sport Utility Vehicle 2WD: "Sport utility vehicle: Standard"
      Standard Sport Utility Vehicle 4WD: "Sport utility vehicle: Standard"
      Sport Utility Vehicle - 2WD: "Sport utility vehicle"
      Sport Utility Vehicle - 4WD: "Sport utility vehicle"
      Special Purpose Vehicle: "Special purpose vehicle"
      Special Purpose Vehicle 2WD: "Special purpose vehicle"
      Special Purpose Vehicle 4WD: "Special purpose vehicle"
      Special Purpose Vehicles: "Special purpose vehicle"
      Special Purpose Vehicles/2wd: "Special purpose vehicle"
      Special Purpose Vehicles/4wd: "Special purpose vehicle"
      Vans Passenger: "Van: Passenger"
      "Vans, Cargo Type": "Van: Cargo"
      "Vans, Passenger Type": "Van: Passenger"
    unresolved_vclasses:
      Vans: "Historical EPA class does not distinguish cargo from passenger vans and ends before the modeled 2000 vintage floor."

  ontario_vehicle_population:
    interim_subdir: fetched_ontario_vehicle_population
    manifest_file: manifest.csv
    # Single-year production replay must not replace all-edition diagnostic evidence.
    edition_audit_subdir_template: "editions/{year}"
    warnings_file: warnings.log
    long_status_file: ontario_vehicle_population_report_a_status_long.csv
    reconciliation_file: ontario_vehicle_population_report_a_reconciliation.csv
    findings_file: ontario_vehicle_population_report_a_data_quality_findings.csv
    current_stock_file: ontario_vehicle_population_report_a_current_fit_active.csv
    all_edition_make_model_keys_file: ontario_vehicle_population_all_edition_make_model_keys.csv
    reports:
      A:
        report_label: "Report A"
        excluded_years: [2015]
        kept_vehicle_classes: [PASSENGER, COMMERCIAL]
        normalized_output_template: ontario_vehicle_population_report_a_normalized_{year}.csv
        required_columns:
          - VEHICLE_CLASS
          - MAKE
          - MODEL
          - MODEL_YEAR
          - FIT_ACTIVE
          - FIT_INACTIVE
          - UNFIT
          - WRECKED
          - OUT_OF_PROV
          - SOLD
          - SUSPENDED
          - TEMPORARY
          - TOTAL
        header_aliases:
          VEHICLE-CLASS: VEHICLE_CLASS
          VEHICLE_CLASS: VEHICLE_CLASS
          MODEL-YEAR: MODEL_YEAR
          MODEL_YEAR: MODEL_YEAR
          FIT-ACTIVE: FIT_ACTIVE
          FIT-INACTIVE: FIT_INACTIVE
          OUT-OF-PROV: OUT_OF_PROV
        vehicle_class_column: VEHICLE_CLASS
        make_column: MAKE
        model_column: MODEL
        model_year_column: MODEL_YEAR
        status_columns:
          - FIT_ACTIVE
          - FIT_INACTIVE
          - UNFIT
          - WRECKED
          - OUT_OF_PROV
          - SOLD
          - SUSPENDED
          - TEMPORARY
        total_column: TOTAL
        passenger_class: PASSENGER
        commercial_class: COMMERCIAL
        suppressed_code_patterns: ['^\*+$']
        unknown_code_labels: [UNKNOWN, UNK, N/A]
      4:
        report_label: "Report 4"
        cleaned_output_template: ontario_vehicle_population_report4_cleaned_{year}.csv
        distribution_output_template: ontario_vehicle_population_report4_epa_gvwr_distribution_{year}.csv
        required_columns: [WEIGHT_CLASS, KG_FROM, KG_TO, FIT-ACTIVE]
        weight_class_column: WEIGHT_CLASS
        kept_weight_class: COMMERCIAL
        kg_from_column: KG_FROM
        kg_to_column: KG_TO
        count_column: FIT-ACTIVE
        output_count_column: NATIVE_COUNT
        epa_gvwr_column: EPA_GVWR
        share_column: SHARE
        epa_gvwr_labels: [LDT1-2, LDT3-4, MDV2b, MDV3, MDV4, MDV5, MDV6, MDV7, MDV8]
        epa_gvwr_bin_edges_lb: [-.inf, 6000, 8500, 10000, 14000, 16000, 19500, 26000, 33000, .inf]
      5:
        report_label: "Report 5"
        cleaned_output_template: ontario_vehicle_population_report5_cleaned_{year}.csv
        distribution_output_template: ontario_vehicle_population_report5_age_distribution_{year}.csv
        required_columns: [VEHICLE_CLASS, DESCRIPTOR, VALUE, FIT-ACTIVE]
        vehicle_class_column: VEHICLE_CLASS
        descriptor_column: DESCRIPTOR
        kept_descriptor: YEAR
        kept_vehicle_classes: [PASSENGER, COMMERCIAL, MOTORCYCLE, BUS]
        model_year_column: VALUE
        count_column: FIT-ACTIVE
        output_count_column: NATIVE_COUNT
        age_column: AGE
        age_distribution_column: AGE_DIST
        max_age: 35

  statcan_tables:
    interim_subdir: fetched_statcan_transport
    manifest_file: manifest.csv
    warnings_file: warnings.log
    read_chunksize: 100000
    provenance_columns:
      - REF_DATE
      - GEO
      - DGUID
      - UOM
      - UOM_ID
      - SCALAR_FACTOR
      - SCALAR_ID
      - VECTOR
      - COORDINATE
      - VALUE
      - STATUS
      - SYMBOL
      - TERMINATED
      - DECIMALS
    geography:
      Canada: {label: Canada, freight_contains: [Canada]}
      AB: {label: Alberta, freight_contains: [Alberta]}
      BC: {label: British Columbia, freight_contains: [British Columbia]}
      BCT:
        label: British Columbia and the Territories
        freight_contains:
        - British Columbia
        - Yukon
        - Northwest Territories
        - Nunavut
      MB: {label: Manitoba, freight_contains: [Manitoba]}
      NB: {label: New Brunswick, freight_contains: [New Brunswick]}
      NL: {label: Newfoundland and Labrador, freight_contains: [Newfoundland and Labrador]}
      NLLAB: {label: Newfoundland and Labrador, freight_contains: [Newfoundland and Labrador]}
      NS: {label: Nova Scotia, freight_contains: [Nova Scotia]}
      NT: {label: Northwest Territories, freight_contains: [Northwest Territories]}
      NU: {label: Nunavut, freight_contains: [Nunavut]}
      "ON": {label: Ontario, freight_contains: [Ontario]}
      PE: {label: Prince Edward Island, freight_contains: [Prince Edward Island]}
      PEI: {label: Prince Edward Island, freight_contains: [Prince Edward Island]}
      QC: {label: Quebec, freight_contains: [Quebec, Québec]}
      SK: {label: Saskatchewan, freight_contains: [Saskatchewan]}
      YT: {label: Yukon, freight_contains: [Yukon]}
    tables:
      "20-10-0021-01":
        normalizer: ldv_archived
        include_bc_for_bct: true
        output_file: statcan_20100021_ldv_registrations_archived.csv
        metadata_dimensions: [Geography, Fuel type, Vehicle type, Statistics]
        required_columns: [REF_DATE, GEO, DGUID, Fuel type, Vehicle type, Statistics, UOM, SCALAR_FACTOR, VALUE]
        selectors:
          Fuel type: [Gasoline, Diesel, Battery electric, Hybrid electric, Plug-in hybrid electric, Other fuel types]
          Vehicle type: [Passenger cars, Pickup trucks, Multi-purpose vehicles, Vans]
          Statistics: [Number of vehicles]
      "20-10-0025-01":
        normalizer: ldv_current
        include_bc_for_bct: true
        output_file: statcan_20100025_ldv_registrations_quarterly.csv
        metadata_dimensions: [Geography, Fuel type, Vehicle type, Statistics]
        required_columns: [REF_DATE, GEO, DGUID, Fuel type, Vehicle type, Statistics, UOM, SCALAR_FACTOR, VALUE]
        selectors:
          Fuel type: [Gasoline, Diesel, Battery electric, Hybrid electric, Plug-in hybrid electric, Other fuel types]
          Vehicle type: [Passenger cars, Pickup trucks, Multi-purpose vehicles, Vans]
          Statistics: [Number of vehicles]
      "23-10-0308-01":
        normalizer: medium_truck_fuels
        ldv_benchmark_output_file: statcan_23100308_ldv_stock.csv
        ldv_benchmark_selectors:
          Vehicle Type: ['Passenger cars, weighing 4,536 kilograms or less', 'Pickup trucks, weighing 4,536 kilograms or less', 'Multi-purpose vehicles, weighing 4,536 kilograms or less', 'Vans, weighing 4,536 kilograms or less']
          Fuel Type: [All fuel types, Gasoline, Diesel, Battery electric, Hybrid electric, Plug-in hybrid electric, Other fuel types]
          Statistics: [Number of vehicles]
        include_bc_for_bct: true
        output_file: statcan_23100308_medium_truck_fuels.csv
        metadata_dimensions: [Geography, Vehicle Type, Fuel Type, Statistics]
        required_columns: [REF_DATE, GEO, DGUID, Vehicle Type, Fuel Type, Statistics, UOM, SCALAR_FACTOR, VALUE]
        selectors:
          Vehicle Type: ["Total, vehicles weighing 4,536 to 11,793 kilograms", "Class 7 vehicles, weighing 11,794 to 14,969 kilograms", "Class 8 vehicles, weighing 14,969 kilograms or more"]
          Fuel Type: [Gasoline, Diesel, Battery electric, Hybrid electric, Plug-in hybrid electric, Other fuel types]
          Statistics: [Number of vehicles]
      "34-10-0254-01":
        include_bc_for_bct: true
        normalizer: bus_lifetimes
        include_canada: true
        output_file: statcan_34100254_bus_expected_life.csv
        metadata_dimensions: [Geography, "Public transit assets, average expected useful life"]
        required_columns: [REF_DATE, GEO, DGUID, "Public transit assets, average expected useful life", UOM, SCALAR_FACTOR, VALUE]
        selectors:
          Public transit assets, average expected useful life:
            - Diesel buses, average expected useful life
            - Bio-diesel buses, average expected useful life
            - Electric buses, average expected useful life
            - Natural gas buses, average expected useful life
            - Hybrid buses (includes diesel, biodiesel and natural gas), average expected useful life
            - Other buses, average expected useful life
      "23-10-0142-01":
        normalizer: freight
        include_bc_for_bct: true
        output_file: statcan_23100142_freight_selected_long.csv
        metadata_dimensions: ["Geography, origin of shipments", "Geography, destination of shipments", "Mode of transportation", "Commodity group", Characteristics]
        required_columns: [REF_DATE, GEO, "Geography, destination of shipments", "Mode of transportation", "Commodity group", Characteristics, UOM, SCALAR_FACTOR, VALUE]
        selectors:
          Mode of transportation: [Truck (for-hire)]
          Characteristics: [Shipments, Weight, Distance, Tonne-kilometres]
    ldv_history:
      canada_proxy_regions: [AB, NL]
      archived_table: "20-10-0021-01"
      current_table: "20-10-0025-01"
      output_file: statcan_ldv_registrations_historical.csv
      overlap_file: statcan_ldv_registrations_overlap.csv
      policy: current_preferred_archived_precoverage_only
      current_period_aggregation: sum_quarters
      complete_periods_per_year: 4
      incomplete_year_policy: exclude_and_warn
      overlap_absolute_tolerance: 0.0
    freight:
      output_file: statcan_23100142_freight_heavy_truck_candidates.csv
      shipments_characteristic: Shipments
      weight_characteristic: Weight
      distance_characteristic: Distance
      tonne_km_characteristic: Tonne-kilometres
      haul_distribution:
        category_column: haul_class
        weight_column: tonne_kilometres
        aggregation: sum
        normalization: share_of_total_tonne_kilometres
      regional_long_haul_threshold_miles: 350.0                           # middle point of the regional (250-mile) and long-haul (500-mile) driving ranges from Autonomie TEA (Islam et al. 2023)
      exact_boundary_assignment: regional
      assumed_truck_curb_weight_kg: 13000.0                               # average curb weight of class 8 trucks, except refuse and urban transit, from Autonomie TEA (Islam et al. 2023)
      class8_gross_vehicle_weight_threshold_kg: 14970.0
      gross_weight_boundary: greater_than_or_equal

