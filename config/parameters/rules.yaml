# Extraction and harmonization rules, organized by their executable owners.
#
# Review order: fetching (source layout/normalization), then parameterization
# (manual selector contracts, reviewed aggregation, stock/demand, utilization,
# lifetimes, efficiency, costs, chargers). Module names match load_harmonization_rules.
# Source access/citations/DQ belong in sources.yaml; run choices belong in scenario
# YAML; reusable numeric unit conversions belong in conversion.yaml.
# Policy strings select supported algorithms and are checked by their consumers;
# Fixed implementation behavior is explained in comments.

version: 2

# SOURCE NORMALIZATION: source-native selectors, labels, and audit outputs.
fetching:
  legacy_charging_profiles:
    value_column: Charging Profile
    hourly_operation: mean
    normalization: annual_hourly_peak
    label_basis: elapsed_hours_from_local_year_start
    precision: 10
    hourly_file: "{profile}_hourly.csv"
    manifest_file: "{profile}_manifest.json"
  epa_omega_baseline:
    # Exact baseline source read by LDV_AER_market_shares.ipynb; no model rerun.
    model_year: 2022
    powertrains: [BEV, PHEV]
    columns: ["Unnamed: 0", manufacturer_id, vehicle_name, model_year, context_size_class, reg_class_id, powertrain_type, onroad_charge_depleting_range_mi, battery_kwh, sales]
    rename: {"Unnamed: 0": source_row_id}
    regulatory_class_map: {car: car, truck: light_truck}
    normalized_file: omega_baseline_plug_in.csv
    manifest_file: omega_baseline_manifest.json
    identity_file: legacy_notebook_identity.json
  greet_vehicle_cycle:
    files:
      normalized: greet_vehicle_cycle_gases.csv
      excluded: greet_vehicle_cycle_exclusions.csv
      models: greet_solved_model_evidence.csv
    inputs_sheet: Inputs
    imports_sheet: GREET1_Import_Export
    simulation_year: {label_cell: B8, label: '1.1) Target Year for Simulation'}
    cohort_year: {label_cell: A20, label: Vehicle Model Year, cells: [B20, C20, D20]}
    ldv_selectors: {Car: 1, SUV: 2, Pickup: 3}
    mhdv_selectors: {Class 6 PnD Trucks: 1, Class 8 Day-Cab Trucks: 2, Class 8 Sleeper-Cab Trucks: 3}
    block_interval: 31
    source_unit_label: mmBtu or grams per vehicle lifetime
    source_units: g/vehicle-lifetime
    gas_rows: [CO2, 'CO2 (VOC, CO, CO2)', CH4, N2O]
    excluded_gas: CO2 (VOC, CO, CO2)
    summary_layout:
      scope_cell: A1
      label_column: A
      unit_column: B
      block_label_offset: -9
      unit_offset: -8
      total_offset: -7
      total_label: Total (No Credits)
    ldv:
      worksheet: Vehi_Sum
      identity_sheet: Vehi_Inputs
      identity_header_cell: A2
      selector_cell: B3
      identity_label_cells: {Car: C3, SUV: C4, Pickup: C5}
      identity_header: 1. Selection of Vehicle Types for Simulation
      identity_labels: {Car: '1 -- Passenger Cars', SUV: '2 -- Sport Utility Vehicles', Pickup: '3 -- Pick-Up Trucks'}
      scope_label: Energy Use and Emissions of Vehicle Cycle
      column: F
      blocks:
        - {first_row: 13, label: '1.1) ICEV: Conventional Material', powertrain: icev, materials: conventional}
        - {first_row: 44, label: '1.2) ICEV: Lightweight Material', powertrain: icev, materials: lightweight}
        - {first_row: 75, label: '1.3) HEV: Conventional Material', powertrain: hev, materials: conventional}
        - {first_row: 106, label: '1.4) HEV: Lightweight Material', powertrain: hev, materials: lightweight}
        - {first_row: 137, label: '1.5) PHEV: Conventional Material', powertrain: phev, materials: conventional}
        - {first_row: 168, label: '1.6) PHEV: Lightweight Material', powertrain: phev, materials: lightweight}
        - {first_row: 199, label: '1.7) EV: Conventional Material', powertrain: bev, materials: conventional}
        - {first_row: 230, label: '1.8) EV: Lightweight Material', powertrain: bev, materials: lightweight}
        - {first_row: 261, label: '1.9) FCV: Conventional Material', powertrain: fcev, materials: conventional}
        - {first_row: 292, label: '1.10) FCV: Lightweight Material', powertrain: fcev, materials: lightweight}
    mhdv:
      worksheet: MHDV_Sum
      identity_sheet: MHDV_Inputs
      identity_header_cell: A2
      selector_cell: B3
      identity_label_cells: {Class 6 PnD Trucks: C3, Class 8 Day-Cab Trucks: C4, Class 8 Sleeper-Cab Trucks: C5}
      identity_header: 1. Selection of Truck Types for Simulation
      identity_labels: {Class 6 PnD Trucks: '1 -- Class 6 PnD Trucks', Class 8 Day-Cab Trucks: '2 -- Class 8 Day-Cab Trucks', Class 8 Sleeper-Cab Trucks: '3 -- Class 8 Sleeper-Cab Trucks'}
      scope_label: 'Energy Use and Emissions of Vehicle Cycle: Trucks'
      column: G
      blocks:
        - {first_row: 13, label: '1.1) ICEV', powertrain: icev}
        - {first_row: 44, label: '1.2) HEV', powertrain: hev}
        - {first_row: 75, label: '1.3) EV', powertrain: bev}
        - {first_row: 106, label: '1.4) FCV', powertrain: fcev}
  nrcan_ceud:
    interim_subdir: fetched_nrcan_ceud_inputs
    manifest_file: manifest.csv
    warnings_file: warnings.log
    empty_output_file: nrcan_ceud_transport_empty.csv
    region_output_template: nrcan_ceud_transport_{region}.csv
    raw_excel_skiprows: 10
    label_column_fallback_index: 1
    drop_columns_if_present: ["Unnamed: 0"]
    null_labels: ["nan", "n.a.", "na"]
    remove_label_characters: "Â¹Â²Â³¹²³"
    allowed_label_characters: "- /()|%"
    drop_raw_series_pattern: "Shares|GHG"
    group_header_value_rows:
      7: ["Total Energy Use (PJ)"]
    table_label_prefix_markers:
      - Activity
      - Energy Intensity
      - Energy Use by Energy Source

  transport_canada_izev:
    interim_subdir: fetched_transport_canada_izev
    output_file: izev_incentive_records.csv
    manifest_file: izev_normalization_manifest.json
