            gge: mi/gge
            dge: mi/dge
          utility_weighted_fuel_source:
            gge: gge/mi
            dge: dge/mi
          utility_weighted_fuel_canadian:
            gge: Lge/100 km
            dge: Lde/100 km
          utility_weighted_electricity_source: Wh/mi
          utility_weighted_electricity_canadian: kWh/100 km
          fuel_energy: Wh-equivalent/mi
          total_energy: Wh-equivalent/mi
        downstream_target_table: limit_tech_input_split_annual
        future_nrcan_phev_contract:
          combined_cd_raw_column: "Combined Le/100 km"
          combined_cd_output_raw_field: combined_cd_consumption_Le_100_km_raw
          combined_cd_output_numeric_field: combined_cd_consumption_Le_100_km
          combined_cd_parse: leading_numeric_only
          combined_cd_leading_numeric_pattern: '^\s*([0-9]+(?:\.[0-9]+)?)'
          combined_cs_raw_column: "Combined (L/100 km)"
