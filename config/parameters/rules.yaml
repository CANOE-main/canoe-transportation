              pattern: (?i)^(?:718\s+)?Cayman\b.*$
              canonical_model: Cayman
        numeric_fields: {'Engine size (L)': displ, Cylinders: cylinders}
        displacement_tolerance_l: 0.05
        # The conventional NRCan resource covers combustion and non-plug-in
        # hybrids; PEVs have separate resources. Preserve mixed HEV/ICE evidence.
        excluded_epa_technologies: [EV, Plug-in Hybrid]
        identity_signal_pattern: '(?i)\b(?:hybrid|MHEV|eTorque|FFV)\b'
        model_aliases:
          # Propulsion evidence only: regional names, with same-year physical
          # configuration checks. No EPA consumption or MTO identity transfer.
          # Mitsubishi groups ASX/OUTLANDER SPORT/RVR: https://www.mitsubishi-motors.com/en/products/
          - {make: Mitsubishi, pattern: '(?i)^(?:RVR|Outlander Sport)$', canonical_model: Outlander Sport, model_year_from: 2011}
          # Canadian MY2021 launch and paired US Voyager specifications:
          # https://media.stellantisnorthamerica.com/newsrelease.do?id=21857&mid=193
          # https://media.stellantisnorthamerica.com/newsrelease.do?id=22923
          - {make: Chrysler, pattern: '(?i)^(?:Grand Caravan|Voyager)$', canonical_model: Voyager, model_year_from: 2021}
          # Nissan explicitly pairs US Rogue Sport / Canadian Qashqai:
          # https://usa.nissannews.com/en-US/releases/nissan-to-expand-propilot-technology-to-additional-models
          - {make: Nissan, pattern: '(?i)^(?:Qashqai|Rogue Sport)$', canonical_model: Rogue Sport, model_year_from: 2017, model_year_to: 2022}
          - {make: Ford, pattern: '(?i)^F[- ]?150(?:\s+Pickup)?$', canonical_model: F-150}
          - {make: Dodge, pattern: '(?i)^(?:Grand\s+)?Caravan(?:/Grand Caravan)?$', canonical_model: Grand Caravan}
          - {make: Honda, pattern: '(?i)^Civic\s+(?:Sedan|4[- ]?(?:Dr|Door))$', canonical_model: Civic}
          - {make: GMC, pattern: '(?i)^Sierra\s+(?:1500|C15|K15)(?:\s+Pickup)?$', canonical_model: Sierra 1500}
          - {make: Chevrolet, pattern: '(?i)^Silverado\s+1500(?:\s+Pickup)?$', canonical_model: Silverado 1500}
          # MINI USA calls the same 3-door body Hardtop 2 Door. Keep S/JCW/SE
          # and 5-door/Clubman/Countryman bodies distinct (official 2022 release):
          # https://www.press.bmwgroup.com/usa/article/detail/T0324990EN_US/
          - {make: MINI, pattern: '(?i)^Cooper\s+(?:3 Door|Hardtop 2 door)$', canonical_model: Cooper Hardtop, model_year_from: 2015}
          - {make: MINI, pattern: '(?i)^Cooper S\s+(?:3 Door|Hardtop 2 door)$', canonical_model: Cooper S Hardtop, model_year_from: 2015}
          - {make: MINI, pattern: '(?i)^John Cooper Works\s+(?:3 Door|Hardtop(?: 2 door)?)$', canonical_model: John Cooper Works Hardtop, model_year_from: 2017}
        transmission:
          nrcan_cvt_pattern: '(?i)^AV'
          epa_cvt_pattern: '(?i)variable|\b(?:AV|CVT)\b'
          nrcan_manual_pattern: '(?i)^M'
          epa_manual_pattern: '(?i)^Manual'
        # For propulsion evidence, AWD/4WD labels both identify driven wheels
        # on both axles; this does not equate their consumption configurations.
        # Do not infer driven wheels when omitted.
        drive_patterns:
          Front-Wheel Drive: '(?i)\bFWD\b'
          Rear-Wheel Drive: '(?i)\bRWD\b'
          Two-Wheel Drive: '(?i)\b2WD\b'
          All-Wheel Drive: '(?i)\b(?:AWD|quattro|4matic|xDrive|SH-AWD)\b'
          4-Wheel Drive: '(?i)\b(?:4WD|4x4)\b'
        compatible_drive_labels:
          Front-Wheel Drive: [Front-Wheel Drive, 2-Wheel Drive]
          Rear-Wheel Drive: [Rear-Wheel Drive, 2-Wheel Drive]
          Two-Wheel Drive: [Front-Wheel Drive, Rear-Wheel Drive, 2-Wheel Drive]
          All-Wheel Drive: [All-Wheel Drive, 4-Wheel Drive, Part-time 4-Wheel Drive, 4-Wheel or All-Wheel Drive]
          4-Wheel Drive: [All-Wheel Drive, 4-Wheel Drive, Part-time 4-Wheel Drive, 4-Wheel or All-Wheel Drive]
        gasoline_fuels: [Regular Gasoline, Premium Gasoline, Midgrade Gasoline]
        unresolved: exclude_and_report
      normalization_pattern: '[^a-z0-9]'
      range_mapping: omega_bucket_boundaries
      # Retained only as legacy audit labels, separate from the production buckets.
      bev_range_edges_km: [0, 250, 500, 900]
      bev_range_labels: [bev_150_miles, bev_300_miles, bev_long_range]
