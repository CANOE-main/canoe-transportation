    interim_subdir: fetched_nlr_atb_autonomie
    manifest_file: manifest.csv
    warnings_file: warnings.log
    components:
      vehicles:
        output_file: atb_vehicles.csv
        phev_powertrain: Plug-in Hybrid
        phev_reconciliation_metrics:
          gge: "Fuel Economy (mi/gge)"
          dge: "Fuel Economy (mi/dge)"
        metric_keys:
          "Fuel Economy (mi/dge)": fuel_economy_mi_per_dge
          "Fuel Economy (mi/gge)": fuel_economy_mi_per_gge
          "Modeled Vehicle Price (2022$)": modeled_vehicle_price
          "Range (mi)": range_mi
          "Useable Energy (kWh)": usable_battery_capacity_kwh
        metric_units:
          "Fuel Economy (mi/dge)": mi/dge
          "Fuel Economy (mi/gge)": mi/gge
          "Modeled Vehicle Price (2022$)": 2022 USD/vehicle
          "Range (mi)": mi
          "Useable Energy (kWh)": kWh
      phev_efficiency:
        output_file: atb_phev_utility_weighted_efficiency.csv
        source_powertrain: Plug-in Hybrid
        light_duty_weight_category: Light Duty
        medium_heavy_weight_category: Medium/Heavy Duty
        source_fields:
          year: year
          source_scenario: scenario
          primary_fuel: fuel_category
          secondary_fuel: fuel2_category
          vehicle_weight_category: vehicle_weight_category
          vehicle_class: vehicle_class
          vehicle_powertrain: vehicle_powertrain
          vehicle_detail: vehicle_detail
          electric_range_mi: "range(mi)"
          source_combined_cs_fuel_economy_mi_per_gge: "CS(mi/gge)"
          source_combined_cd_electricity_consumption_wh_per_mi: "CD(Wh/mi)"
          vehicle_input_reference: reference
        source_key_fields: [year, scenario, fuel_category, fuel2_category, vehicle_weight_category, vehicle_class, vehicle_powertrain, vehicle_detail]
        fuel_equivalent_basis:
          Gasoline: gge
          Diesel: dge
        cycle_aggregation:
          cycles:
            ARB:
              contribution: ARB_contribution
              cs_fuel_economy: "ARB_CS(mpgde)"
              cd_electricity_consumption: "ARB_CD(Wh/mi)"
            EPA55:
              contribution: EPA55_contribution
              cs_fuel_economy: "EPA55_CS(mpgde)"
              cd_electricity_consumption: "EPA55_CD(Wh/mi)"
            EPA65:
