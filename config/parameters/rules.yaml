            EPA55:
              contribution: EPA55_contribution
              cs_fuel_economy: "EPA55_CS(mpgde)"
              cd_electricity_consumption: "EPA55_CD(Wh/mi)"
            EPA65:
              contribution: EPA65_contribution
              cs_fuel_economy: "EPA65_CS(mpgde)"
              cd_electricity_consumption: "EPA65_CD(Wh/mi)"
        utility_factor_matching:
          utility_factor_column: phev_uf
          reference_column: reference
          notes_column: notes
          ldv:
            source_family: phev_uf_ldv
            exact_key_fields: [vehicle_weight_category, "range(mi)"]
            interpolation_dimension: "range(mi)"
            interpolation_method: linear
            allow_extrapolation: false
          mdhd:
            source_family: phev_uf_mdhd
            exact_key_fields: [vehicle_weight_category, vehicle_class]
        reconciliation:
          output_key_fields: [year, scenario, fuel_category, fuel2_category, vehicle_weight_category, vehicle_class, vehicle_powertrain, vehicle_detail]
          derived_to_output_key_fields:
            year: year
            scenario: trajectory
            fuel_category: primary_fuel
            fuel2_category: secondary_fuel
            vehicle_weight_category: vehicle_weight_category
            vehicle_class: vehicle_class
            vehicle_powertrain: vehicle_powertrain
            vehicle_detail: vehicle_detail
          scenario_aliases:
            Constant: Conservative
          metric_by_basis:
            gge: "Fuel Economy (mi/gge)"
            dge: "Fuel Economy (mi/dge)"
          absolute_tolerance_mi_per_gallon_equivalent: 1.0e-9
          relative_tolerance: 1.0e-6
          policy: report_only
        tolerances:
          cycle_contribution_sum: 1.0e-9
          utility_factor_bounds: 1.0e-12
          input_share_sum: 1.0e-12
        conversion_keys:
          mile_to_km: [length, mile_to_km]
          us_gallon_to_litre: [volume, us_gallon_to_litre]
          wh_to_kwh: [energy, wh_to_kwh]
          wh_per_gge: [energy, wh_per_gge]
          wh_per_dge: [energy, wh_per_dge]
          gal_equivalent_per_mile_to_litre_equivalent_per_100_km: [derived, us_gallon_equivalent_per_mile_to_litre_equivalent_per_100_km]
          wh_per_mile_to_kwh_per_100_km: [derived, wh_per_mile_to_kwh_per_100_km]
        units:
