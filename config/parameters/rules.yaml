      minimum_model_prefix_length: 3
      minimum_model_year: 2000
      candidate_minimum_model_year: 1950
      exclude_future_model_years: false
      model_year_role: crosswalk_range_selector_and_evidence_priority
      class_resolution: exact_mto_year_then_nearest_source_year
