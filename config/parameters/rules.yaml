      maintenance_ldv:
        outputs:
          class_multipliers: atb_maintenance_ldv_class_multipliers.csv
          powertrain_multipliers: atb_maintenance_ldv_powertrain_multipliers.csv
          baseline_repair_cost: atb_maintenance_ldv_baseline_repair_cost.csv
          maintenance_cost: atb_maintenance_ldv_maintenance_cost.csv
      vmt:
        output_file: atb_age_vmt.csv
        value_column: vmt_mi
        unit: mi/vehicle-year
      anl_bean:
        output_file: anl_bean_mhdv_maintenance_coefficients.csv
        workbook_sheet: "TCO Assumpt."
