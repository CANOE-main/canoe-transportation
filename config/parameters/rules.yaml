# Routing index only. Parameter values belong to exactly one declared member.
# No glob discovery, recursive includes or cross-file overrides; see AGENTS.md.

version: 3
partitions:
- file: source_normalization.yaml
  fetching:
  - legacy_charging_profiles
  - epa_omega_baseline
  - greet_vehicle_cycle
  - nrcan_ceud
  - transport_canada_izev
  - nrcan_fuel_consumption_ratings
  - fueleconomy_vehicle_data
  - ontario_vehicle_population
  - statcan_tables
  - cer_enerfuture
  - nlr_atb_autonomie
  - afdc
  - assorted_sources
  - vpic_vehicle_types
  - vpic_model_years
- file: fleet_stock_and_activity.yaml
  parameterization:
  - ceud_inputs
  - manual_parameters
  - road_aggregation
  - road_stocks_and_demands
  - offroad_stocks_and_demands
  - road_utilization
  - road_lifetimes_survival
  - vehicle_reference
- file: vehicle_efficiency_and_emissions.yaml
  parameterization:
  - road_embodied_emissions
  - ceud_energy_calibration
  - efficiencies
- file: transport_costs.yaml
  parameterization:
  - costs
- file: charging_and_range_representation.yaml
  parameterization:
  - ldv_charging_profiles
  - ldv_ev_ranges
  - ev_chargers
- file: transport_diagnostic_controls.yaml
  parameterization:
  - charging_cost_comparison
  - transportation_research
  - notebook_diagnostics
  - rating_stock_benchmark
  - ldv_efficiency_diagnostic
  - ldv_composition_benchmark
