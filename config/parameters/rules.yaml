            - '(?i)\s+(?:LE|SE|XLE|XSE|Limited|Premium|Platinum|SR|SV|SL|Sport|S|GT|LX|EX)(?:/(?:LE|SE|XLE|XSE|Limited|Premium|Platinum|SR|SV|SL|Sport|S|GT|LX|EX))+$'
            - '(?i)\s+(?:AWD|FWD|RWD|4WD|4X4|2WD|QUATTRO|4MATIC|XDRIVE|ALL4)$'
            - '(?i)\s+(?:Standard Range(?: Plus)?|Long Range|Extended Range|Short Range|Performance|High Power|Low Power)$'
