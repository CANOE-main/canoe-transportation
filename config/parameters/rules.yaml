        freight_light_trucks: {BEV: T_LDV_LTF_BEV_EX, PHEV: T_LDV_LTF_GSL_PHEV_EX, phev_blend: T_BLND_GSL_ELC_PHEV_LTF_EX, phev_commodity: T_gsl_elc_phev_ltf_ex}
    new_suffix: _N
    constraint_operator: ge  # MinNewCapacityShare!C23:F40; never silently use equality.
