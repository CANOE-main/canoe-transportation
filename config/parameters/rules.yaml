          method: provincial_observation_count
          # Whole recipient-region/model-year/BEV-or-PHEV pool, before matching.
          # Below this count, choose national data; never exclude a fine class/range.
          # This is a geography rule, not market coverage or sampling confidence.
          minimum_observations: 100
          national_provinces: [AB, BC, MB, NB, NL, NS, NT, NU, 'ON', PE, QC, SK, YT]
        empirical_subclasses: median_fill_original_weights
