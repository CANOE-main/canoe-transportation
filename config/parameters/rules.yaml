# MODEL PARAMETERS: harmonization, allocation, mappings, and parameter artifacts.
parameterization:
  ceud_inputs:
    cagr: {history_start_year: 2013, excluded_years: [2020, 2021], zero_endpoint: constant}
    audit_file: ceud_extension_audit.csv
    manifest_file: ceud_parameter_inputs_manifest.json

  # Opt-in researcher comparisons; these references never parameterize production.
  charging_cost_comparison:
    reference_route: transportation_validation_charging_inputs
    legacy_baseline: legacy_backend/canoe_on_12d_baseline.sqlite
    report_route: charging_cost_comparison_report
    files: {cost_invest: CostInvest.csv, cost_fixed: CostFixed.csv, cost_variable: CostVariable_ALL.csv}
    groups:
      ldv:
        reference_technologies: [T_LDV_BEV_CHRG, T_LDV_PHEV_CHRG]
        existing: T_LDV_CHRG_EX
        new: T_LDV_CHRG_N
      mhdv:
        reference_technologies: [T_MDV_CHRG, T_HDV_CHRG]
        existing: T_MHDV_CHRG_EX
        new: T_MHDV_CHRG_N
    reference_basis:
      name: user_confirmed_2020_CAD_per_PJ_year
      currency: CAD
      dollar_year: 2020
      denominator: PJ/year_capacity
      evidence: >-
        User confirmation 2026-10-29: million 2020 CAD and PJ/year of charging
        throughput. Embedded utilization and loss conventions were not supplied.
    conditional_bases:
      - name: effective_output_at_backend_utilization
        currency: CAD
        dollar_year: 2020
        denominator: PJ/year_at_backend_utilization
        evidence: >-
          Sensitivity only: normalize backend rated capacity using its configured
          utilization target; do not infer embedded utilization in the reference.

  transportation_research:
    reference_route: transportation_validation_researcher_inputs
    report_route: transportation_research_report
    # Select a captured report, independently of whether its scenario YAML survives.
    notebook_scenario: config/scenarios/validation_baseline.yaml
    comparison_significance_percent: 5.0
    reference_sqlite: canoe_ON_16d.sqlite
    reference_notebook: Update data_20260618_fixed lifetime (1).ipynb
    # Original notebook Input data/canoe_ALL_cm.sqlite is unavailable. Explicit
    # inherited-parameter substitution; disputed capacity/demand are not authority.
    inherited_sqlite: legacy_backend/legacy_variant_sales_cohorts/canoe_ON_16d.sqlite
    legacy_baseline: legacy_backend/canoe_on_12d_baseline.sqlite
    energy_series:
      cars: {table_id: 20, raw_series: Car Energy Use (PJ)}
      passenger_light_trucks: {table_id: 34, raw_series: Passenger Light Truck Energy Use (PJ)}
      freight_light_trucks: {table_id: 35, raw_series: Freight Light Truck Energy Use (PJ)}
      medium_trucks: {table_id: 36, raw_series: Medium Truck Energy Use (PJ)}
      heavy_trucks: {table_id: 36, raw_series: Heavy Truck Energy Use1 (PJ)}

  road_embodied_emissions:
    transformation_version: '3'
    vintage_treatment: constant_solved_year
    constant_through_year: 2050
    # Reviewed native selector defect is harmless only while range inputs match.
    lightweight_bev_range_mismatch: allow_equal_glider_inputs
    # Range keys belong to the current technology/ATB archetype contract, not Python.
    ldv_range_miles: {phev_35_miles: 35, phev_50_miles: 50, bev_150_miles: 150, bev_200_miles: 200, bev_300_miles: 300, bev_400_miles: 400}
    source_units: g/vehicle-lifetime
    capacity_units: k vehicles
    gas_commodities: {CO2: co2, CH4: ch4, N2O: n2o}
    # CH4/N2O use tonnes to increase numerical coefficients without changing mass.
    gas_scaling:
      CO2: {commodity_units: kt, output_units: kt/k vehicles, conversion_key: grams_per_vehicle_to_kt_per_thousand_vehicles}
      CH4: {commodity_units: t, output_units: t/k vehicles, conversion_key: grams_per_vehicle_to_tonnes_per_thousand_vehicles}
      N2O: {commodity_units: t, output_units: t/k vehicles, conversion_key: grams_per_vehicle_to_tonnes_per_thousand_vehicles}
    files:
      aggregation: emission_embodied_aggregation.csv
      parameters: emission_embodied.csv
      coverage: coverage.csv
      integrity: integrity.json
    road_classes:
      cars: {family: ldv, aggregation: direct, source_class: Car}
      passenger_light_trucks: {family: ldv, aggregation: pickup_suv}
      freight_light_trucks: {family: ldv, aggregation: pickup_suv}
      medium_trucks: {family: mhdv, aggregation: medium_gvwr}
      heavy_trucks: {family: mhdv, aggregation: heavy_haul}
    # Keep only the existing pickup/SUV groups and renormalize their observed weights.
    light_truck_classes: {Pickup: Pickup, Small SUV: SUV, Midsize SUV: SUV}
    heavy_class_map:
      Class 8 Beverage DayCab: Class 8 Day-Cab Trucks
      Class 8 Drayage DayCab: Class 8 Day-Cab Trucks
      Class 8 Regional DayCab: Class 8 Day-Cab Trucks
      Class 8 Longhaul Sleeper: Class 8 Sleeper-Cab Trucks
    powertrain_map:
      ldv:
        gasoline: icev
        diesel: icev
        cng: icev
        hev: hev
        phev_35_miles: phev
        phev_50_miles: phev
        bev_150_miles: bev
        bev_200_miles: bev
        bev_300_miles: bev
        bev_400_miles: bev
        fcev: fcev
      mhdv: {gasoline: icev, diesel: icev, cng: icev, hev: hev, phev: hev, bev: bev, fcev: fcev, fchev: fcev}
    weight_tolerance: 1.0e-9
    new_technology_suffix: _N
    # User-approved Class 6 representation retains each region's GVWR shares.
    medium_class_map: {2: Class 6 PnD Trucks, 3: Class 6 PnD Trucks, 4: Class 6 PnD Trucks, 5: Class 6 PnD Trucks, 6: Class 6 PnD Trucks, 7: Class 6 PnD Trucks}
  manual_parameters:
    # Manual CSVs remain review-owned. This section controls only validation,
    # selector expansion, and auditable interim publication.
    interim_subdir: resolved_manual_parameters
    technology_template_file: technology.csv
    source_column: "source -> data_source"
    notes_column: notes
    technology_id_column: tech
    technology_class_column: technology_class
    input_column_aliases:
      lifetime_process.csv: {category: technology_class}
    technology_category_column: category
    technology_sub_category_column: sub_category
    powertrain_column: powertrain
    parameter_column: parameter
    wildcard_selector: all
    remainder_selector: remainder
    projection_year_pattern: '^(?P<base>.+)_(?P<year>(?:19|20)\d{2})$'
    unmatched_policy: report
    behavior_specific_files: [charger_parameters.csv, capacity_to_activity.csv, efficiency_multipliers.csv, cost_invest_multipliers.csv, cost_variable_multipliers.csv]
    internal_assumption_files:
      capacity_to_activity.csv:
        expected_columns: [category, sub_category, units, c2a, notes]
        unique_key: [category, sub_category]
        expected_rows: 10
    powertrain_aliases:
      jet_fuel: [jet_fuel, "jet fuel"]
      mdo: [mdo, "marine diesel oil"]
      hfo: [hfo, "heavy fuel oil"]
      electric: [electric, bev]
    registry_file: manual_parameter_registry.csv
    resolution_file: manual_parameter_technology_resolution.csv
    reconciliation_file: manual_parameter_reconciliation.csv
    findings_file: manual_parameter_findings.csv

  road_aggregation:
    # Source precedence is selected once by the scenario's aggregation_sources.
    ldv_weight_basis: all_vintages
    medium_trucks:
      # Report 4 Class 2b uses ATB Class 2 consumption, price and VMT schedules.
      report4_gvwr: {MDV2b: 2, MDV3: 3, MDV4: 4, MDV5: 5, MDV6: 6, MDV7: 7}
      wards_year: 2020
      wards_classes: [3, 4, 5, 6, 7]
      wards_class_pattern: '^Class ([3-7])$'
