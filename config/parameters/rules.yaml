# Extraction and harmonization contracts for registered source artifacts.
#
# Each `parameterization` entry is consumed by its named adapter or parameter module and
# owns source-layout selectors, mappings, filters, bins, thresholds, normalization
# choices, and deterministic interim artifact names. Use stable keys, keep comments next
# to the value they explain, and add a focused consumer test for each new contract.
#
# External identity, access, citations, and physical availability checks belong in
# `config/sources.yaml`; run selections belong in scenario YAML; reusable numeric unit
# conversions belong in `conversion.yaml`.

version: 1

parameterization:
  costs:
    transformation_version: '1'
    parity: {absolute_tolerance: 1.0e-9, relative_tolerance: 1.0e-6}
    nlr_road_retail_price_equivalent_markup: 1.5
    aircraft_operating_days_per_year: 365
    ldv_repair_price_exponent_per_usd: 0.00002
    ldv_repair_max_age: 14
    historical_msrp_proxy: earliest_selected_atb_price
    missing_mhdv_purchase_powertrain_proxy: {gasoline: diesel, cng: diesel}
    spk_aircraft_cost_proxy: jet_fuel
    intercity_purchase_source_keys: {diesel: icev, gasoline: icev, cng: cngv, hev: icev, bev: bev, fcev: hfcv}
    ldv_powertrain_evidence: {gasoline: Gasoline, diesel: Diesel, cng: Natural Gas, hev: Gasoline Hybrid, phev_35_miles: Plug-in Hybrid, phev_50_miles: Plug-in Hybrid, bev_150_miles: Battery Electric, bev_200_miles: Battery Electric, bev_300_miles: Battery Electric, bev_400_miles: Battery Electric, fcev: Hydrogen Fuel Cell}
    bean_powertrain_evidence: {gasoline: Conv, diesel: Conv, cng: Conv, hev: ParHEV, phev: SeriesPHEV, bev: BEV, fcev: FCEV, fchev: FCHEV}
    bean_gvwr_proxy: {2: 'BoxMedium 4', 3: 'BoxMedium 4', 4: 'BoxMedium 4', 5: 'BoxMedium 4', 6: 'BoxMedium 6', 7: 'BoxMedium 6'}
    bean_class_alias: {'Class 8 Beverage DayCab': 'RegionalDayCab 8', 'Class 8 Drayage DayCab': 'DrayageDayCab 8', 'Class 8 Regional DayCab': 'RegionalDayCab 8', 'Class 8 Longhaul Sleeper': 'LonghaulSleeper 8', 'Class 8 Transit Heavy': 'TransitHeavy 8', 'Class 3 Medium School': 'TransitHeavy 8', 'Class 7 Medium School': 'TransitHeavy 8'}
    offroad_multiplier_period_year: {through_2035: 2035, through_2050: 2050}
    files:
      road_invest: road_cost_invest.csv
      road_variable: road_cost_variable.csv
      offroad_invest: offroad_cost_invest.csv
      offroad_variable: offroad_cost_variable.csv
      currency_audit: currency_harmonization.csv
      integrity: cost_integrity.json
  efficiencies:
    transformation_version: '1'
    files:
      efficiency: efficiency.csv
      splits: limit_tech_input_split.csv
      annual: annual_efficiency_evidence.csv
      loads: road_load_factors.csv
      ratings: classified_rating_evidence.csv
      atb: aggregated_atb_consumption.csv
      rating_weights: aggregated_rating_consumption.csv
      split_evidence: phev_blend_energy_share_evidence.csv
      relationships: technology_commodity_relationships.csv
      findings: findings.csv
      integrity: integrity.json
    future_year_rule: interval_end
    historical_aggregation: mean_annual_service_efficiency
    historical_first_bin: available_source_years_only
    historical_single_year_technologies: {T_MDV_T_BEV_EX: 2023}
    historical_classes_without_capacity: []
    future_load_factor: base_year
    rating_weight_basis: all_vintages
    missing_rating_classes: renormalize_observed
    missing_annual_rating: configured_analogue_index
    historical_rating_observations: through_base_year
    historical_rating_baseline: latest_own_observation_indexed_to_base_year
    unknown_powertrain: error
    region_output_map: {NL: NLLAB, PE: PEI}
    existing_suffix: _EX
    future_suffix: _N
    excluded_categories: [charger, h2_refuel]
    excluded_technology_patterns: ['^T_dummy_', '^T_BLND_(ETH|RDSL|JTF|SPK)']
    unit_efficiencies: {T_OFF: {input: T_dsl, output: T_D_pj_off, units: PJ/PJ}}
    service_units: {passenger: bn passenger-km/PJ, freight: bn tonne-km/PJ}
    tolerances: {weight_sum: 1.0e-9, split_sum: 1.0e-12}
    parity: {absolute_tolerance: 1.0e-9, relative_tolerance: 1.0e-6}
    # Existing-capacity owns the currently shared population evidence selector.
    population_source_selector: existing_capacity.other_region_vehicle_population_source
    supported_population_source: ontario_ministry_transport_vehicle_population
    md_weight_source: latest_ontario_report4
    md_gvwr: {MDV2b: 2, MDV3: 3, MDV4: 4, MDV5: 5, MDV6: 6, MDV7: 7}
    md_excluded_vocations: [School, Transit, Refuse]
    within_gvwr_aggregation: equal_vocation_consumption
    heavy_vocations:
      regional: [Class 8 Beverage DayCab, Class 8 Drayage DayCab, Class 8 Regional DayCab]
      long_haul: [Class 8 Longhaul Sleeper]
    historical_suv:
      source_label: Sport utility vehicle
      combined_weight_classes: ['Sport utility vehicle: Small', 'Sport utility vehicle: Standard']
    ratings:
      fields: {year: Model year, make: Make, model: Model, class: Vehicle class, fuel: Fuel type, consumption: 'Combined (L/100 km)', electricity: 'Combined (kWh/100 km)', bev_range: 'Range (km)', phev_range: 'Range 1 (km)'}
      fuel_codes: {X: gasoline, Z: gasoline, D: diesel, E: ethanol, N: cng}
      excluded_fuels: [ethanol]
      hybrid_pattern: '(?i)hybrid'
      evidence_source: fueleconomy_gov_vehicle_data
      evidence_columns: [year, make, model, atvType]
      hybrid_evidence_label: Hybrid
      evidence_join: exact_normalized_year_make_model
      ambiguous_evidence: retain_name_rule_and_report
      normalization_pattern: '[^a-z0-9]'
      # Legacy Fuel_consumption_ratings.ipynb: (0,250], (250,500], (500,900] km.
      bev_range_edges_km: [0, 250, 500, 900]
      bev_range_labels: [bev_150_miles, bev_300_miles, bev_long_range]
      phev_range_edges_km: [0, 55, 210]
      phev_range_labels: [phev_35_miles, phev_50_miles]
      phev_historical_index: combined_cs_consumption
      phev_baseline: nlr_atb
      ignored_classes: [Special purpose vehicle]
    ldv_archetypes:
      gasoline: {detail: 'Gasoline ICE Vehicle (spark ignition)', analogue: gasoline}
      diesel: {detail: Diesel Conventional Compression Ignition Vehicle, analogue: gasoline}
      cng: {detail: Compressed Natural Gas Conventional Vehicle, analogue: gasoline}
      hev: {detail: Gasoline Power Split Hybrid Electric Vehicle, analogue: bev_150_miles}
      phev_35_miles: {range_mi: 35, analogue: hev}
      phev_50_miles: {range_mi: 50, analogue: hev}
      bev_150_miles: {detail: 'Battery Electric Vehicle (150-mile range)', analogue: gasoline}
      bev_200_miles: {detail: 'Battery Electric Vehicle (200-mile range)', analogue: bev_150_miles}
      bev_300_miles: {detail: 'Battery Electric Vehicle (300-mile range)', analogue: bev_150_miles}
      bev_400_miles: {detail: 'Battery Electric Vehicle (400-mile range)', analogue: bev_300_miles}
      # Legacy Efficiency AC46/AC58/AC70 index FCEVs to the gasoline incumbent.
      fcev: {detail: Hydrogen Fuel Cell Electric Vehicle, analogue: gasoline}
    mhdv_archetypes:
      diesel: {detail: Diesel ICE Vehicle}
      gasoline: {detail: Diesel ICE Vehicle, proxy: diesel}
      cng: {detail: Diesel ICE Vehicle, proxy: diesel}
      hev: {detail: Diesel Parallel Hybrid Electric Vehicle}
      phev: {detail: Diesel Series Plug-in Hybrid Electric Vehicle}
      bev: {detail: Battery Electric Vehicle}
      fcev: {detail: Hydrogen Fuel Cell Electric Vehicle}
      fchev: {detail: Hydrogen Fuel Cell Hybrid Electric Vehicle}
    # ATB 2024 lacks SI/CNG MHDV rows; user-approved incumbent proxy is explicit.
    missing_powertrain_proxy: diesel
    ldv_incumbent_fallback: gasoline
    atb:
      weight_categories: {ldv: Light Duty, mhdv: Medium/Heavy Duty}
      metric_basis: {fuel_economy_mi_per_gge: gge, fuel_economy_mi_per_dge: dge}
      class_pattern: '^Class ([2-8]) '
      source_energy_basis: {gge: wh_per_gge, dge: wh_per_dge}
      fuel_equivalent_hhv_powertrains: [gasoline, diesel, hev, cng, fcev, fchev]
      equivalent_gallon_hhv_fuel: {gge: gasoline, dge: diesel}
      # Retain source-native PHEV energy; final fuel-equivalent energy uses GREET HHV.
      phev_energy_basis: greet_hhv_fuel_plus_electricity
      interpolation: linear_consumption
      extrapolation: error
    historical_index_fuels: {medium_trucks: {gasoline: gasoline, diesel: diesel, bev: diesel}, heavy_trucks: {diesel: diesel}}
    phev_blend_by_category: {medium_trucks: mdv, heavy_trucks: hdv, school_buses: hdv, urban_transit: hdv}
    road_classes:
      cars: {pathway: ldv, weights: Car, service: passenger, stock_table: 21, stock: 'Stock (thousands)|Cars', distance: 'Average Distance Travelled per Year (km)|Cars'}
      passenger_light_trucks: {pathway: ldv, weights: Light Truck, service: passenger, stock_table: 37, stock: 'Stock (thousands)|Passenger Light Trucks', distance: 'Average Distance Travelled per Year (km)|Passenger Light Trucks'}
      freight_light_trucks: {pathway: ldv, weights: Light Truck, service: freight, stock_table: 37, stock: 'Stock (thousands)|Freight Light Trucks', distance: 'Average Distance Travelled per Year (km)|Freight Light Trucks'}
      medium_trucks: {pathway: mhdv, service: freight, stock_table: 37, stock: 'Stock (thousands)|Medium Trucks', distance: 'Average Distance Travelled per Year (km)|Medium Trucks', cs_prefix: 'Medium Truck On-Road Average Fuel Consumption (L/100 km)'}
      heavy_trucks: {pathway: mhdv, service: freight, stock_table: 37, stock: 'Stock (thousands)|Heavy Trucks', distance: 'Average Distance Travelled per Year (km)|Heavy Trucks', cs_prefix: 'Heavy Truck On-Road Average Fuel Consumption (L/100 km)'}
      school_buses: {pathway: bus, service: passenger, stock_table: 31, stock: 'Stock (thousands)|School Buses', distance: 'Average Distance Travelled per Year (km)|School Buses', intensity_table: 28, intensity: 'School Buses|Energy Intensity (MJ/Pkm)', atb_classes: [Class 3 Medium School, Class 7 Medium School]}
      urban_transit: {pathway: bus, service: passenger, stock_table: 31, stock: 'Stock (thousands)|Urban Transit', distance: 'Average Distance Travelled per Year (km)|Urban Transit', intensity_table: 29, intensity: 'Urban Transit|Energy Intensity (MJ/Pkm)', atb_classes: [Class 8 Transit Heavy]}
      inter_city_buses: {pathway: intercity, service: passenger, stock_table: 31, stock: 'Stock (thousands)|Inter-City Buses', distance: 'Average Distance Travelled per Year (km)|Inter-City Buses', intensity_table: 30, intensity: 'Inter-City Buses|Energy Intensity (MJ/Pkm)', atb_classes: [Class 8 Transit Heavy]}
      motorcycles: {pathway: motorcycle, service: passenger, stock_table: 32, stock: 'Motorcycle Explanatory Variables|Stock (thousands)', distance: 'Motorcycle Explanatory Variables|Average Distance Travelled per Year (km)', intensity_table: 32, intensity: 'Motorcycle|Energy Intensity (MJ/Pkm)'}
    fuel_series: {gasoline: Motor Gasoline, diesel: Diesel Fuel Oil}
    input_commodities:
      gasoline: T_gsl
      diesel: T_dsl
      hev: T_gsl
      cng: T_cng
      jet_fuel: T_jtf
      spk: T_spk
      mdo: T_mdo
      hfo: T_hfo
      lng: T_lng
      h2: T_h2_mhdv
    subcategory_aliases: {jet fuel: jet_fuel, marine diesel oil: mdo, heavy fuel oil: hfo}
    electric_inputs: {ldv: T_elc_ldv_chrg, motorcycle: T_elc_ldv_chrg, mhdv: T_elc_mhdv_chrg, bus: T_elc_mhdv_chrg, intercity: T_elc_mhdv_chrg}
    hydrogen_inputs: {ldv: T_h2_ldv, mhdv: T_h2_mhdv, bus: T_h2_mhdv, intercity: T_h2_mhdv}
    phev_blends:
      ldv35: {tech: T_BLND_GSL_ELC_PHEV35, output: T_gsl_elc_phev35, fuel: T_gsl, electricity: T_elc_ldv_chrg, archetype: phev_35_miles, weight_category: Light Duty}
      ldv50: {tech: T_BLND_GSL_ELC_PHEV50, output: T_gsl_elc_phev50, fuel: T_gsl, electricity: T_elc_ldv_chrg, archetype: phev_50_miles, weight_category: Light Duty}
      mdv: {tech: T_BLND_DSL_ELC_MDV, output: T_dsl_elc_mdv, fuel: T_dsl, electricity: T_elc_mhdv_chrg, archetype: phev, weight_category: Medium/Heavy Duty, gvwr: [2, 3, 4, 5, 6, 7]}
      hdv: {tech: T_BLND_DSL_ELC_HDV, output: T_dsl_elc_hdv, fuel: T_dsl, electricity: T_elc_mhdv_chrg, archetype: phev, weight_category: Medium/Heavy Duty, gvwr: [8]}
    phev_split_method: mean_energy_shares_across_classes_and_horizon_endpoints
    phev_split_operator: e
    phev_split_target: limit_tech_input_split
    intercity:
      baseline_class: urban_transit
      multiplier_basis: regen_intercity_powertrain_over_diesel_fuel_economy
      source_keys: {diesel: icev-dsl, gasoline: icev-dsl, cng: cngv, bev: bev, fcev: hfcv}
      hev_ratio: atb_transit_hev_over_diesel
    motorcycle: {gasoline: Liquids, bev: BEV, gasoline_fuel: gasoline}
    offroad:
      manual_file: efficiency_multipliers.csv
      period_upper_year: {through_2035: 2035, through_2050: 2050}
      period_method: linear_interpolation_between_endpoints
      annual_improvement: efficiency_compound_growth
      # Rail rows already invert REGEN Table 7 consumption ratios (0.24, 0.65/0.6).
      ratio_interpretation:
        passenger_rail: {diesel_relative_energy_intensity: efficiency_ratio}
        freight_rail: {diesel_relative_energy_intensity: efficiency_ratio}
        freight_marine: {mdo_relative_energy_intensity: consumption_ratio}
      incumbent: {passenger_air: jet_fuel, freight_air: jet_fuel, passenger_rail: diesel, freight_rail: diesel, freight_marine: mdo}
      equal_incumbent_powertrains: [spk]

  manual_parameters:
    # Manual CSVs remain review-owned. This section controls only validation,
    # selector expansion, and auditable interim publication.
    interim_subdir: resolved_manual_parameters
    technology_template_file: technology.csv
    source_column: "source -> data_source"
    notes_column: notes
    technology_id_column: tech
    technology_class_column: technology_class
    input_column_aliases:
      lifetime_process.csv: {category: technology_class}
    technology_category_column: category
    technology_sub_category_column: sub_category
    powertrain_column: powertrain
    parameter_column: parameter
    wildcard_selector: all
    remainder_selector: remainder
    projection_year_pattern: '^(?P<base>.+)_(?P<year>(?:19|20)\d{2})$'
    unmatched_policy: report
    behavior_specific_files: [charger_shares_utilization.csv, capacity_to_activity.csv, efficiency_multipliers.csv, cost_invest_multipliers.csv, cost_variable_multipliers.csv]
    internal_assumption_files:
      capacity_to_activity.csv:
        expected_columns: [category, sub_category, units, c2a, notes]
        unique_key: [category, sub_category]
        expected_rows: 10
    powertrain_aliases:
      jet_fuel: [jet_fuel, "jet fuel"]
      mdo: [mdo, "marine diesel oil"]
      hfo: [hfo, "heavy fuel oil"]
      electric: [electric, bev]
    registry_file: manual_parameter_registry.csv
    resolution_file: manual_parameter_technology_resolution.csv
    reconciliation_file: manual_parameter_reconciliation.csv
    findings_file: manual_parameter_findings.csv

  nrcan_ceud:
    interim_subdir: fetched_nrcan_ceud_inputs
    manifest_file: manifest.csv
    warnings_file: warnings.log
    empty_output_file: nrcan_ceud_transport_empty.csv
    region_output_template: nrcan_ceud_transport_{region}.csv
    raw_excel_skiprows: 10
    label_column_fallback_index: 1
    drop_columns_if_present: ["Unnamed: 0"]
    null_labels: ["nan", "n.a.", "na"]
    remove_label_characters: "Â¹Â²Â³¹²³"
    allowed_label_characters: "- /()|%"
    drop_raw_series_pattern: "Shares|GHG"
    group_header_value_rows:
      7: ["Total Energy Use (PJ)"]
    table_label_prefix_markers:
      - Activity
      - Energy Intensity
      - Energy Use by Energy Source

  nrcan_fuel_consumption_ratings:
    interim_subdir: fetched_nrcan_fuel_consumption_ratings
    manifest_file: manifest.csv
    warnings_file: warnings.log
    encoding_candidates: [utf-8-sig, cp1252]
    outputs:
      battery_electric_2012_2026: nrcan_battery_electric_vehicles_2012_2026.csv
      plug_in_hybrid_2012_2026: nrcan_plug_in_hybrid_electric_vehicles_2012_2026.csv
      fuel_consumption_1995_2014: nrcan_fuel_consumption_ratings_1995_2014.csv
      fuel_consumption_2015_2024: nrcan_fuel_consumption_ratings_2015_2024.csv
      fuel_consumption_2025: nrcan_fuel_consumption_ratings_2025.csv
      fuel_consumption_2026: nrcan_fuel_consumption_ratings_2026.csv
    vehicle_class_harmonization:
      target_source: nlr_atb_transportation_2024
      target_dimension: vehicle_class
      target_to_nrcan:
        Compact: [Minicompact, Subcompact, Compact]
        Midsize: [Mid-size, Full-size, Two-seater, "Station wagon: Small", "Station wagon: Mid-size"]
        Small SUV: ["Sport utility vehicle: Small"]
        Midsize SUV: ["Sport utility vehicle: Standard", Minivan]
        Pickup: ["Pickup truck: Small", "Pickup truck: Standard", "Van: Cargo", "Van: Passenger"]
      unresolved_nrcan_classes: [Special purpose vehicle, "Sport utility vehicle"]
      unmapped_policy: error
      historical_class_note: >-
        The 1995-2014 ratings use the unsplit Sport utility vehicle label and retain
        Van: Cargo. The generic SUV label does not distinguish the established Small
        versus Midsize SUV targets, so retain it only in source-normalized efficiency
        evidence and exclude it from NLR mapping inference. Treat cargo/passenger vans
        with pickups while retaining the source-native NRCan label in normalized evidence.

  fueleconomy_vehicle_data:
    interim_subdir: fetched_fueleconomy_vehicle_data
    output_file: fueleconomy_vehicle_class_evidence.csv
    manifest_file: manifest.csv
    warnings_file: warnings.log
    selected_columns: [year, make, model, VClass]
    output_columns:
      year: Model year
      make: Make
      model: Model
      VClass: Source vehicle class
    vclass_to_nrcan:
      Compact Cars: Compact
      Large Cars: Full-size
      Midsize Cars: Mid-size
      Minicompact Cars: Minicompact
      Subcompact Cars: Subcompact
      Two Seaters: Two-seater
      Small Station Wagons: "Station wagon: Small"
      Midsize Station Wagons: "Station wagon: Mid-size"
      Midsize-Large Station Wagons: "Station wagon: Mid-size"
      Minivan - 2WD: Minivan
      Minivan - 4WD: Minivan
      Small Pickup Trucks: "Pickup truck: Small"
      Small Pickup Trucks 2WD: "Pickup truck: Small"
      Small Pickup Trucks 4WD: "Pickup truck: Small"
      Standard Pickup Trucks: "Pickup truck: Standard"
      Standard Pickup Trucks 2WD: "Pickup truck: Standard"
      Standard Pickup Trucks 4WD: "Pickup truck: Standard"
      Standard Pickup Trucks/2wd: "Pickup truck: Standard"
      Small Sport Utility Vehicle 2WD: "Sport utility vehicle: Small"
      Small Sport Utility Vehicle 4WD: "Sport utility vehicle: Small"
      Standard Sport Utility Vehicle 2WD: "Sport utility vehicle: Standard"
      Standard Sport Utility Vehicle 4WD: "Sport utility vehicle: Standard"
      Sport Utility Vehicle - 2WD: "Sport utility vehicle"
      Sport Utility Vehicle - 4WD: "Sport utility vehicle"
      Special Purpose Vehicle: "Special purpose vehicle"
      Special Purpose Vehicle 2WD: "Special purpose vehicle"
      Special Purpose Vehicle 4WD: "Special purpose vehicle"
      Special Purpose Vehicles: "Special purpose vehicle"
      Special Purpose Vehicles/2wd: "Special purpose vehicle"
      Special Purpose Vehicles/4wd: "Special purpose vehicle"
      Vans Passenger: "Van: Passenger"
      "Vans, Cargo Type": "Van: Cargo"
      "Vans, Passenger Type": "Van: Passenger"
    unresolved_vclasses:
      Vans: "Historical EPA class does not distinguish cargo from passenger vans and ends before the modeled 2000 vintage floor."

  ontario_vehicle_population:
    interim_subdir: fetched_ontario_vehicle_population
    manifest_file: manifest.csv
    warnings_file: warnings.log
    long_status_file: ontario_vehicle_population_report_a_status_long.csv
    reconciliation_file: ontario_vehicle_population_report_a_reconciliation.csv
    findings_file: ontario_vehicle_population_report_a_data_quality_findings.csv
    current_stock_file: ontario_vehicle_population_report_a_current_fit_active.csv
    all_edition_make_model_keys_file: ontario_vehicle_population_all_edition_make_model_keys.csv
    reports:
      A:
        report_label: "Report A"
        excluded_years: [2015]
        kept_vehicle_classes: [PASSENGER, COMMERCIAL]
        normalized_output_template: ontario_vehicle_population_report_a_normalized_{year}.csv
        required_columns:
          - VEHICLE_CLASS
          - MAKE
          - MODEL
          - MODEL_YEAR
          - FIT_ACTIVE
          - FIT_INACTIVE
          - UNFIT
          - WRECKED
          - OUT_OF_PROV
          - SOLD
          - SUSPENDED
          - TEMPORARY
          - TOTAL
        header_aliases:
          VEHICLE-CLASS: VEHICLE_CLASS
          VEHICLE_CLASS: VEHICLE_CLASS
          MODEL-YEAR: MODEL_YEAR
          MODEL_YEAR: MODEL_YEAR
          FIT-ACTIVE: FIT_ACTIVE
          FIT-INACTIVE: FIT_INACTIVE
          OUT-OF-PROV: OUT_OF_PROV
        vehicle_class_column: VEHICLE_CLASS
        make_column: MAKE
        model_column: MODEL
        model_year_column: MODEL_YEAR
        status_columns:
          - FIT_ACTIVE
          - FIT_INACTIVE
          - UNFIT
          - WRECKED
          - OUT_OF_PROV
          - SOLD
          - SUSPENDED
          - TEMPORARY
        total_column: TOTAL
        passenger_class: PASSENGER
        commercial_class: COMMERCIAL
        suppressed_code_patterns: ['^\*+$']
        blank_code_label: blank
        unknown_code_labels: [UNKNOWN, UNK, N/A]
      4:
        report_label: "Report 4"
        cleaned_output_template: ontario_vehicle_population_report4_cleaned_{year}.csv
        distribution_output_template: ontario_vehicle_population_report4_epa_gvwr_distribution_{year}.csv
        required_columns: [WEIGHT_CLASS, KG_FROM, KG_TO, FIT-ACTIVE]
        weight_class_column: WEIGHT_CLASS
        kept_weight_class: COMMERCIAL
        kg_from_column: KG_FROM
        kg_to_column: KG_TO
        count_column: FIT-ACTIVE
        output_count_column: NATIVE_COUNT
        epa_gvwr_column: EPA_GVWR
        share_column: SHARE
        epa_gvwr_labels: [LDT1-2, LDT3-4, MDV2b, MDV3, MDV4, MDV5, MDV6, MDV7, MDV8]
        epa_gvwr_bin_edges_lb: [-.inf, 6000, 8500, 10000, 14000, 16000, 19500, 26000, 33000, .inf]
      5:
        report_label: "Report 5"
        cleaned_output_template: ontario_vehicle_population_report5_cleaned_{year}.csv
        distribution_output_template: ontario_vehicle_population_report5_age_distribution_{year}.csv
        required_columns: [VEHICLE_CLASS, DESCRIPTOR, VALUE, FIT-ACTIVE]
        vehicle_class_column: VEHICLE_CLASS
        descriptor_column: DESCRIPTOR
        kept_descriptor: YEAR
        kept_vehicle_classes: [PASSENGER, COMMERCIAL, MOTORCYCLE, BUS]
        model_year_column: VALUE
        count_column: FIT-ACTIVE
        output_count_column: NATIVE_COUNT
        age_column: AGE
        age_distribution_column: AGE_DIST
        max_age: 35

  road_aggregation:
    vehicle_size_class_map_file: vehicle_size_class_map.csv
    vehicle_size_class_map_ownership_note: >-
      Reviewed version-controlled configuration. Ordinary fetching and
      parameterization commands read this file but never regenerate or
      overwrite it. The explicit vehicle_mapping_bootstrap maintainer command
      is development-only, is never part of default ETL, and may write a
      requested replacement only when deliberately invoked. Once the manual
      MTO review is complete, ordinary installations use this reviewed file
      directly and do not reproduce mapping inference. The reviewed file
      contains accepted MTO crosswalk rows only; source-native key inventories
      and source-family catalogues are generated interim evidence.
    accepted_mapping_statuses: [reviewed]
    mapping_bootstrap:
      reviewed_crosswalk_policy: rebuild
      accept_reviewed_strong_candidates: true
      accepted_candidate_model_similarity: 0.7
