# Registered report parsing and source-native charger production extraction.
infrastructure_output_files:
  ldv: infrastructure_ldv.csv
  mhdv: infrastructure_mhdv.csv
  power: infrastructure_power.csv
  utilization: infrastructure_utilization.csv
  costs: infrastructure_costs.csv
  operating: infrastructure_operating.csv
required_edition_tokens:
- February 2024
- '23028'
- Updated forecasts of vehicle charging needs, grid impacts and costs for all vehicle segments
context_patterns:
  mhdv_partial_charge: For example, the 6-vehicle partial charge throughput input for public vehicles which would draw (?P<daily_energy_kwh>\d+)
    kWh daily on average.*?Return to footnote 67 referrer
  mhdv_population: We mapped the CEUD vehicle categories.*?used in this study \(as described in Section 3\.1\)
  mhdv_zev_scrappage: We assume a ZEV scrappage rate of (?P<scrappage_percent>\d+)%.*?over time\.
  mhdv_scenarios: 'Three MHDV sales forecast scenarios: Policy Reference.*?Slow Adoption \(35% by 2032\)\.'
  mhdv_hydrogen_sensitivity: We further assume that all MHDVs will be battery-electric vehicles.*?lower hydrogen prices\.
tables:
  6:
    html_id: t6
    caption_pattern: Table 6\. Estimated total charging infrastructure needs for light-duty vehicles charging for Canada
    rows: 25
    columns: 6
    header_rows: 1
    evidence_kind: projected_requirement
  12:
    html_id: t12
    caption_pattern: Table 12\. Per-port installation and equipment cost estimates \(2022 dollars\)
    rows: 3
    columns: 5
    header_rows: 1
    evidence_kind: source_cost_assumption
  19:
    html_id: t19
    caption_pattern: Table 19\. Assumptions for power levels, daily throughput, and share of MHDV charger types
    rows: 7
    columns: 7
    header_rows: 2
    evidence_kind: source_operating_assumption
  21:
    html_id: t21
    caption_pattern: Table 21\. MHDV per-port power and capital cost assumptions
    rows: 5
    columns: 6
    header_rows: 2
    evidence_kind: source_cost_assumption
  30:
    html_id: t430
    caption_pattern: Table 30\. Average nameplate power of all installed chargers \(kW\)
    rows: 7
    columns: 7
    header_rows: 1
    evidence_kind: source_installed_power_assumption
  31:
    html_id: t31
    caption_pattern: Table 31\. Average annual charging port utilization rate
    rows: 5
    columns: 7
    header_rows: 1
    evidence_kind: source_utilization_assumption
  38:
    html_id: t38
    caption_pattern: Table 38\. MHDV port counts under each scenario
    rows: 28
    columns: 7
    header_rows: 1
    evidence_kind: projected_requirement
  44:
    html_id: t44
    caption_pattern: Table 44\. MHDV public port count by region and charger type \(Policy Reference Scenario\)
    rows: 12
    columns: 17
    header_rows: 2
    evidence_kind: projected_requirement
