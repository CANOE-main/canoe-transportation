# Reusable numeric conversion factors shared by source and parameter modules.
# Keys state the conversion direction; source-specific transforms and run selections
# belong in `rules.yaml` and scenario YAML respectively.

version: 1

mass:
  kg_to_lb: 2.20462

length:
  mile_to_km: 1.609344

energy:
  gigawatt_year_to_petajoule: 31.536

statcan:
  scalar_factor_multipliers:
    units: 1.0
    tens: 10.0
    hundreds: 100.0
    thousands: 1000.0
    millions: 1000000.0
    billions: 1000000000.0
