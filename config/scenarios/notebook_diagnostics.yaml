# One offline preparation for both road notebooks; run builds serially.
version: 3

scenario:
  name: notebook_diagnostics
  description: "Road stock evidence and the existing-to-future efficiency bridge"
  purpose: diagnostic_preset

geography:
  regions: ["ON"]

periods:
  period_mode: prospective
  base_year: 2023
  existing: [2000, 2005, 2010, 2015, 2020]
  model: [2025, 2030, 2035, 2040, 2045]
  step: 5

outputs:
  sqlite_name: canoe_transport_notebook_diagnostics.sqlite
  validation_report: outputs/validation/notebook_diagnostics_build.json
  setup_log: outputs/logs/notebook_diagnostics_setup.json

comparison:
  mode: none
  reference_sqlite: null
  absolute_tolerance: 1.0e-9
  relative_tolerance: 1.0e-6
  include_provenance: false

sources:
  nrcan_ceud_beyond_observed: constant  # error | constant | extrapolated; source edition remains unchanged.
  selections:
    nrcan_ceud_transport_provincial: {year: 2023}
    nrcan_ceud_transport_national: {year: 2023}
    transport_canada_ev_dashboard: {year: 2026}
    cer_canadas_energy_future: {edition: 2026}

aggregation_sources:
  stock_age:
    "ON": ontario_ministry_transport_vehicle_population
    other: ontario_ministry_transport_vehicle_population
  ldv:
    "ON": ontario_ministry_transport_vehicle_population
    other: ontario_ministry_transport_vehicle_population
  medium_trucks:
    "ON": ontario_ministry_transport_vehicle_population
    other: wards_intelligence_sales_shares
  heavy_truck_haul:
    "ON": statcan_transport_tables
    other: statcan_transport_tables

economics:
  cer_scenario: Current Measures
  global_discount_rate: 0.03
  default_loan_rate: 0.03
  cost_reference_currency: CAD
  cost_reference_year: 2020

lifetimes:
  survival_curves: true
  road_lifetime_survival_source: nhtsa_nems  # nhtsa_nems | moves
  survival_curve_max_age: null  # Optional hard zero age; null derives the endpoint.
  tail_derivation: constant_retirement  # Continue the last annual retirement rate.
  tail_survival_threshold: 0.005  # Surviving fraction: 0.5%, then zero the following year.

existing_capacity:
  vehicle_population_year: 2025
  cleanup_tolerance: 0.001

demand:
  cer_scenario: Current Measures
  future_car_demand: GDP-indexed

road_utilization:
  vkt_schedules: false

efficiencies:
  ceud_energy_calibration: false  # Optional CEUD-reported liquid-energy fit; no default promotion.
  atb_trajectory: Mid

costs:
  atb_trajectory: Mid

ev_chargers:
  ld_evs_per_port: 1.0
  mhd_evs_per_port: 1.5

charging_profiles:
  travel_behavior_source: none
  charging_strategy: uncontrolled  # uncontrolled | night | day; Toronto local clock
  time_mapping: null

BEV_PHEV_range_representation:
  mode: new_capacity_shares

embodied_emissions: false
embodied_materials: conventional

row_note_overrides:
  technology: {}

# Opt-in review evidence; never a production parameter input.
notebook_diagnostics: [vehicle_stock, efficiency]
