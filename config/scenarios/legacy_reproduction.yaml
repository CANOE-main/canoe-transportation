# Run selections and modeling switches for the legacy-reproduction build.
# Source availability and provenance live in `sources.yaml`; only source-specific
# run selections appear here. See `config/scenarios/README.md` for field behavior.

version: 2

scenario:
  name: legacy_reproduction
  description: "Reproduce the legacy transportation backend before changing modeling assumptions."
  purpose: baseline_reproduction

geography:
  # Quote ON because YAML 1.1 parsers otherwise interpret it as a boolean.
  regions: ["ON", "AB", "BCT", "MB", "NB", "NL", "NS", "PE", "QC", "SK"]

periods:
  # Periods begin at the end of a given year (e.g., the 2025 period starts on December 31, 2025, and ends on December 31, 2030)
  # All inputs for a given period reflect the projections for the END of that period (e.g., 2025 inputs reflect 2030 condition)
  base_year: 2023
  existing: [2000, 2005, 2010, 2015, 2020, 2023]
  model: [2025, 2030, 2035, 2040, 2045]
  step: 5

sources:
  selections:
    nrcan_ceud_transport_provincial: {year: 2023}
    nrcan_ceud_transport_national: {year: 2023}
    transport_canada_ev_dashboard: {year: 2026}
    cer_canadas_energy_future:
      edition: 2026
    nlr_atb_transportation_2024:
      edition: 2024
      trajectory: Mid

economics:
  global_discount_rate: 0.03
  default_loan_rate: 0.03
  cost_reference_currency: CAD
  cost_reference_year: 2020

outputs:
  sqlite_name: canoe_transport_legacy_reproduction.sqlite
  validation_report: outputs/validation/legacy_reproduction_database_bootstrap.json
  setup_log: outputs/logs/setup_smoke_legacy_reproduction.json

validation:
  reference_sqlite: legacy_backend/canoe_on_12d_baseline.sqlite
  compare_legacy: true

switches:
  # Use accepted road survival curves; remaining technologies use fixed lifetimes.
  survival_curves: true
  survival_curve_max_age: 25  # must not exceed the time horizon
  vkt_schedules: false

existing_capacity:
  other_region_vehicle_population_source: ontario_ministry_transport_vehicle_population
  cleanup_epsilon: 0.001

demand:
  cer_scenario: Current Measures
  future_car_demand: GDP-indexed

road_utilization:
  medium_truck_weight_source: national_wards
